<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="505" version="1.1" viewBox="0 0 1040 505" width="1040" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="505" rx="14" stroke="#d3dfeb" stroke-width="1.5" width="1040" x="0" y="0" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="30" y="45">IPv4 分片｜4000 B 数据 / MTU 1500 B</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" text-anchor="start" x="30" y="73">假定 IPv4 首部固定 20 B，DF=0，所有分片共用同一标识；末片可不是 8 B 的整数倍。</text><line stroke="#d3dfeb" stroke-width="2" x1="30" x2="1010" y1="88" y2="88" /><rect fill="#f0f6ff" height="80" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="974" x="30" y="111" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="55" y="140">原始数据报</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="235" y="141">20 B 首部</text><rect fill="#cce6ff" height="39" rx="5" stroke="#7fb3f2" stroke-width="1.2" width="585" x="364" y="123" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" text-anchor="middle" x="656" y="149">4000 B 数据载荷（原始总长 4020 B）</text><rect fill="#fafcff" height="68" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="974" x="30" y="182" /><rect fill="#e3efff" height="34" rx="4" stroke="#6fa8f8" stroke-width="1.2" width="132" x="50" y="200" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="116" y="223">第1片</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="216" y="223">首部 20 B</text><rect fill="#e6f7f3" height="37" rx="4" stroke="#75cbb6" stroke-width="1.2" width="310" x="338" y="199" /><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="493" y="223">数据 1480 B</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="665" y="223">总长 1500 B</text><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="start" x="835" y="218">偏移 0</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="835" y="242">MF=1</text><rect fill="#fafcff" height="68" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="974" x="30" y="268" /><rect fill="#e3efff" height="34" rx="4" stroke="#6fa8f8" stroke-width="1.2" width="132" x="50" y="286" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="116" y="309">第2片</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="216" y="309">首部 20 B</text><rect fill="#e6f7f3" height="37" rx="4" stroke="#75cbb6" stroke-width="1.2" width="310" x="338" y="285" /><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="493" y="309">数据 1480 B</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="665" y="309">总长 1500 B</text><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="start" x="835" y="304">偏移 185</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="835" y="328">MF=1</text><rect fill="#fafcff" height="68" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="974" x="30" y="354" /><rect fill="#e3efff" height="34" rx="4" stroke="#6fa8f8" stroke-width="1.2" width="132" x="50" y="372" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="116" y="395">第3片</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="216" y="395">首部 20 B</text><rect fill="#e6f7f3" height="37" rx="4" stroke="#75cbb6" stroke-width="1.2" width="310" x="338" y="371" /><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="493" y="395">数据 1040 B</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="665" y="395">总长 1060 B</text><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="start" x="835" y="390">偏移 370</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="835" y="414">MF=0</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="32" y="468">计算：每个满片载荷 = floor((1500−20)/8)×8 = 1480 B；偏移 = 此前数据字节数÷8。</text></svg>