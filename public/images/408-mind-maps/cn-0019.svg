<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="常用编码：非归零、归零、反向不归零、曼彻斯特、差分曼彻斯特">
<title>常用编码：非归零、归零、反向不归零、曼彻斯特、差分曼彻斯特</title>
<rect x="0.75" y="0.75" width="838.5" height="458.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">数字数据 → 数字信号的编码</text>
