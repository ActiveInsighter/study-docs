<text x="180" y="78.5" font-size="13" fill="#18181b" text-anchor="end" font-weight="700">二进制数据</text>
<text x="232" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">1</text>
<text x="296" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="360" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="424" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">1</text>
<text x="488" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">1</text>
<text x="552" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="616" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">1</text>
<text x="680" y="78.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<path d="M200 60L200 420" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<path d="M264 60L264 420" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<path d="M328 60L328 420" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<path d="M392 60L392 420" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<path d="M456 60L456 420" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<path d="M520 60L520 420" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<path d="M584 60L584 420" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
