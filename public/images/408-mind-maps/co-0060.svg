<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="多重中断与屏蔽字：高优先级中断可以打断低优先级的中断服务">
<title>多重中断与屏蔽字：高优先级中断可以打断低优先级的中断服务</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker><marker id="ad1493a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#d1493a"/></marker></defs>
<rect x="0.75" y="0.75" width="638.5" height="298.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">多重中断：优先级高的可打断低的</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<text x="90" y="90.2" font-size="12" fill="#18181b" text-anchor="end">程序 1</text>
<path d="M100 86L600 86" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/>
<text x="90" y="120.2" font-size="12" fill="#18181b" text-anchor="end">程序 2</text>
<path d="M100 116L600 116" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/>
<text x="90" y="150.2" font-size="12" fill="#18181b" text-anchor="end">程序 3</text>
<path d="M100 146L600 146" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/>
<text x="90" y="180.2" font-size="12" fill="#18181b" text-anchor="end">程序 4</text>
<path d="M100 176L600 176" fill="none" stroke="#a1a1aa" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/>
<path d="M120 240L620 240" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M120 240L120 66" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M140 240V86H200V146H300V86H400V240H430V146H450V176H470V146H490V116H560V240" fill="none" stroke="#3b6fd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="64" font-size="12" fill="#d1493a">先请求了 1</text>
<path d="M196 64L146 80" fill="none" stroke="#d1493a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="302" y="200" font-size="11" fill="#d1493a" text-anchor="middle">3 的处理次序更高，打断 1，执行 3</text>
<path d="M240 186L208 152" fill="none" stroke="#d1493a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="180" y="274" font-size="12" fill="#3f3f46">1、2、3、4 同时请求中断</text>
<path d="M176 268L142 244" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
</svg>
