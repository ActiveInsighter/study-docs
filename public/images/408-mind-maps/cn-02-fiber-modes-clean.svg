<svg baseProfile="full" height="470" version="1.1" viewBox="0 0 1030 470" width="1030" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="470" width="1030" x="0" y="0" /><rect fill="#f8fafc" height="442" rx="20" ry="20" stroke="#dbe6f3" stroke-width="1.5" width="1002" x="14" y="14" /><text fill="#17324d" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="42" y="64">单模与多模：模式数和色散不同</text><text fill="#2563eb" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="start" x="75" y="127">多模光纤（多种模式）</text><rect fill="#e0f2fe" height="95" rx="28" ry="28" stroke="#60a5fa" stroke-width="2" width="850" x="80" y="150" /><rect fill="#ffffff" height="61" rx="20" ry="20" stroke="#90a4bf" stroke-width="1.5" width="850" x="80" y="167" /><polyline fill="none" points="100,198 230,171 360,222 490,171 620,222 750,171 911,198" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" points="100,198 285,198 470,183 675,200 911,198" stroke="#d97706" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" points="100,198 285,213 470,185 675,218 911,198" stroke="#7c3aed" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#0f766e" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="start" x="75" y="287">单模光纤（主要基模）</text><rect fill="#e0f2fe" height="95" rx="28" ry="28" stroke="#60a5fa" stroke-width="2" width="850" x="80" y="310" /><rect fill="#ffffff" height="61" rx="20" ry="20" stroke="#90a4bf" stroke-width="1.5" width="850" x="80" y="327" /><polyline fill="none" points="100,359 280,357 470,359 670,357 911,359" stroke="#0f766e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#53667b" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" text-anchor="middle" x="512" y="275">多模式传播时延差异可产生模式色散</text><text fill="#53667b" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" text-anchor="middle" x="513" y="433">单模减少模式色散，常用于更长距离；实际仍受色度色散等限制</text></svg>