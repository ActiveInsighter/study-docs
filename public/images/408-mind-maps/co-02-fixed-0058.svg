<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="先行进位的理论依据：进位产生函数 G 与进位传递函数 P">
<title>先行进位的理论依据：进位产生函数 G 与进位传递函数 P</title>
<defs><marker id="aa1a1aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#a1a1aa"/></marker></defs>
<rect x="0.75" y="0.75" width="758.5" height="278.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">先行（超前）进位：C<tspan baseline-shift="-22%" font-size="9.5">i</tspan> = G<tspan baseline-shift="-22%" font-size="9.5">i</tspan> + P<tspan baseline-shift="-22%" font-size="9.5">i</tspan>C<tspan baseline-shift="-22%" font-size="9.5">i−1</tspan></text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="30" y="70" width="300" height="120" rx="12" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="180" y="98" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">进位来源</text>
<text x="50" y="130" font-size="14" fill="#2f8f57" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">G<tspan baseline-shift="-22%" font-size="9.5">i</tspan> = A<tspan baseline-shift="-22%" font-size="9.5">i</tspan>B<tspan baseline-shift="-22%" font-size="9.5">i</tspan></text>
<text x="200" y="130" font-size="12" fill="#71717a">本级产生（进位产生）</text>
<text x="50" y="162" font-size="14" fill="#d1493a" font-weight="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">P<tspan baseline-shift="-22%" font-size="9.5">i</tspan> = A<tspan baseline-shift="-22%" font-size="9.5">i</tspan> ⊕ B<tspan baseline-shift="-22%" font-size="9.5">i</tspan></text>
<text x="200" y="162" font-size="12" fill="#71717a">低位传递（进位传递）</text>
<rect x="370" y="70" width="360" height="150" rx="12" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="390" y="102" font-size="14" fill="#18181b" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C<tspan baseline-shift="-22%" font-size="9.5">1</tspan> = G<tspan baseline-shift="-22%" font-size="9.5">1</tspan> + P<tspan baseline-shift="-22%" font-size="9.5">1</tspan>C<tspan baseline-shift="-22%" font-size="9.5">0</tspan></text>
<text x="390" y="134" font-size="14" fill="#18181b" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C<tspan baseline-shift="-22%" font-size="9.5">2</tspan> = G<tspan baseline-shift="-22%" font-size="9.5">2</tspan> + P<tspan baseline-shift="-22%" font-size="9.5">2</tspan>G<tspan baseline-shift="-22%" font-size="9.5">1</tspan> + P<tspan baseline-shift="-22%" font-size="9.5">2</tspan>P<tspan baseline-shift="-22%" font-size="9.5">1</tspan>C<tspan baseline-shift="-22%" font-size="9.5">0</tspan></text>
<text x="390" y="166" font-size="14" fill="#18181b" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C<tspan baseline-shift="-22%" font-size="9.5">3</tspan> = G<tspan baseline-shift="-22%" font-size="9.5">3</tspan> + P<tspan baseline-shift="-22%" font-size="9.5">3</tspan>G<tspan baseline-shift="-22%" font-size="9.5">2</tspan> + P<tspan baseline-shift="-22%" font-size="9.5">3</tspan>P<tspan baseline-shift="-22%" font-size="9.5">2</tspan>G<tspan baseline-shift="-22%" font-size="9.5">1</tspan></text>
<text x="390" y="192" font-size="14" fill="#18181b" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">      + P<tspan baseline-shift="-22%" font-size="9.5">3</tspan>P<tspan baseline-shift="-22%" font-size="9.5">2</tspan>P<tspan baseline-shift="-22%" font-size="9.5">1</tspan>C<tspan baseline-shift="-22%" font-size="9.5">0</tspan></text>
<path d="M332 130L368 130" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aa1a1aa)"/>
<text x="380" y="256" font-size="12.5" fill="#3f3f46" text-anchor="middle">展开后各 C<tspan baseline-shift="-22%" font-size="9.5">i</tspan> 只依赖 A、B 和 C<tspan baseline-shift="-22%" font-size="9.5">0</tspan>：输入同时到达即可同时求出 C<tspan baseline-shift="-22%" font-size="9.5">1</tspan> ~ C<tspan baseline-shift="-22%" font-size="9.5">3</tspan></text>
</svg>
