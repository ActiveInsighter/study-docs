<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="TCP 连接建立：三次握手">
<title>TCP 连接建立：三次握手</title>
<defs><marker id="a2f8f57" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#2f8f57"/></marker><marker id="a3b6fd4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3b6fd4"/></marker><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker><marker id="a3f3f46s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0.8L1.5 5 10 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="678.5" height="378.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">TCP 连接建立（三次握手）</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<text x="160" y="60" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="600">客户机 A</text>
<text x="520" y="60" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="600">服务器 B</text>
<path d="M160 70L160 360" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M520 70L520 360" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="110" y="72" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="94" font-size="11.5" fill="#18181b" text-anchor="middle">CLOSED</text>
<rect x="110" y="142" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="164" font-size="11.5" fill="#18181b" text-anchor="middle">SYN-SENT</text>
<rect x="110" y="252" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="266.3" font-size="11.5" fill="#18181b" text-anchor="middle"><tspan x="160" dy="0">ESTAB-</tspan><tspan x="160" dy="15.5">LISHED</tspan></text>
<rect x="470" y="72" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="520" y="94" font-size="11.5" fill="#18181b" text-anchor="middle">CLOSED</text>
<rect x="470" y="122" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="520" y="144" font-size="11.5" fill="#18181b" text-anchor="middle">LISTEN</text>
<rect x="470" y="202" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="520" y="224" font-size="11.5" fill="#18181b" text-anchor="middle">SYN-RCVD</text>
<rect x="470" y="282" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="520" y="296.3" font-size="11.5" fill="#18181b" text-anchor="middle"><tspan x="520" dy="0">ESTAB-</tspan><tspan x="520" dy="15.5">LISHED</tspan></text>
<text x="100" y="140" font-size="11" fill="#3f3f46" text-anchor="end">主动打开</text>
<text x="580" y="120" font-size="11" fill="#3f3f46">被动打开</text>
<path d="M210 160L470 220" fill="none" stroke="#3b6fd4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<rect x="285.5" y="181.2" width="109" height="17.5" rx="3" fill="#ffffff"/>
<text x="340" y="194" font-size="11.5" fill="#3b6fd4" text-anchor="middle">SYN = 1，seq = x</text>
<path d="M470 222L210 252" fill="none" stroke="#2f8f57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2f8f57)"/>
<rect x="221.8" y="228.6" width="236.5" height="16.9" rx="3" fill="#ffffff"/>
<text x="340" y="240.8" font-size="11" fill="#2f8f57" text-anchor="middle">SYN = 1，ACK = 1，seq = y，ack = x + 1</text>
<path d="M210 262L470 292" fill="none" stroke="#3b6fd4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<rect x="237.5" y="268.6" width="205" height="16.9" rx="3" fill="#ffffff"/>
<text x="340" y="280.9" font-size="11" fill="#3b6fd4" text-anchor="middle">ACK = 1，seq = x + 1，ack = y + 1</text>
<text x="240" y="120" font-size="10.5" fill="#2f8f57" text-anchor="middle">无数据（SYN 不允许携带数据）</text>
<text x="340" y="308" font-size="10.5" fill="#3b6fd4" text-anchor="middle">（第三次握手可以携带数据了）</text>
<path d="M270 340L410 340" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)" marker-start="url(#a3f3f46s)"/>
<text x="340" y="332" font-size="11" fill="#3f3f46" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">数据传送</text>
</svg>
