<path d="M530 212L330 292" fill="none" stroke="#2f8f57" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2f8f57)"/>
<path d="M536 86q8 0 8 8V118q0 8 8 8q-8 0 -8 8V158q0 8 -8 8" fill="none" stroke="#71717a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="558" y="130.6" font-size="13" fill="#71717a">t₁</text>
<path d="M536 170q8 0 8 8V202q0 8 8 8q-8 0 -8 8V242q0 8 -8 8" fill="none" stroke="#71717a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="558" y="214.6" font-size="13" fill="#71717a">t₁</text>
<text x="430" y="330" font-size="13" fill="#d1493a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">P = 7t₂ / (2t₁ + t₂ + t₃)</text>
<text x="600" y="60" font-size="12.5" fill="#18181b" font-weight="600">③ SR　W<tspan baseline-shift="-22%" font-size="72%">T</tspan> = 4，W<tspan baseline-shift="-22%" font-size="72%">R</tspan> = 4</text>
<text x="690" y="170" font-size="13" fill="#d1493a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">P = 4t₂ / (2t₁ + t₂ + t₃)</text>
<text x="690" y="210" font-size="11.5" fill="#71717a" text-anchor="middle"><tspan x="690" dy="0">t₁：单程传播时延</tspan><tspan x="690" dy="17.2">t₂：发送一帧的时间</tspan><tspan x="690" dy="17.2">t₃：确认帧发送时间</tspan></text>
</svg>
