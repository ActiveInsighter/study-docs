<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="信道利用率：停等、GBN、SR 的时序比较">
<title>信道利用率：停等、GBN、SR 的时序比较</title>
<defs><marker id="a2f8f57" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#2f8f57"/></marker></defs>
<rect x="0.75" y="0.75" width="818.5" height="358.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">信道利用率的推导</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<text x="40" y="60" font-size="12.5" fill="#18181b" font-weight="600">① 停止—等待　W<tspan baseline-shift="-22%" font-size="72%">T</tspan> = W<tspan baseline-shift="-22%" font-size="72%">R</tspan> = 1</text>
<path d="M60 76L60 300" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M260 76L260 300" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60 86L260 166" fill="none" stroke="#3b6fd4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M260 176L60 256" fill="none" stroke="#2f8f57" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2f8f57)"/>
<path d="M266 86q8 0 8 8V118q0 8 8 8q-8 0 -8 8V158q0 8 -8 8" fill="none" stroke="#71717a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="288" y="130.6" font-size="13" fill="#71717a">t₁</text>
<path d="M266 170q8 0 8 8V202q0 8 8 8q-8 0 -8 8V242q0 8 -8 8" fill="none" stroke="#71717a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="288" y="214.6" font-size="13" fill="#71717a">t₁</text>
<text x="160" y="330" font-size="13" fill="#d1493a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">P = t₂ / (2t₁ + t₂ + t₃)</text>
<text x="310" y="60" font-size="12.5" fill="#18181b" font-weight="600">② GBN　W<tspan baseline-shift="-22%" font-size="72%">T</tspan> = 7，W<tspan baseline-shift="-22%" font-size="72%">R</tspan> = 1</text>
