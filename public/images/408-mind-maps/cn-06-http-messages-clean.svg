<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1245 552" width="1245" height="552" role="img" aria-label="HTTP/1.1：请求报文与响应报文并列" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>HTTP/1.1：请求报文与响应报文并列</title><rect width="1245" height="552" rx="18" fill="#ffffff"/><rect x="1" y="1" width="1243" height="550" rx="18" fill="none" stroke="#d9e3ec" stroke-width="2"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9z" fill="#3b5c82"/></marker></defs><text x="40" y="50" font-size="26" fill="#182e46" font-weight="700">HTTP/1.1：请求报文与响应报文并列</text><line x1="40" y1="67" x2="1205" y2="67" stroke="#e1e8f0" stroke-width="2"/><rect x="45" y="110" width="548" height="62" rx="12" fill="#eaf2ff" stroke="#8daac9" stroke-width="2"/><text x="319.0" y="147.0" fill="#1b314c" font-size="18" font-weight="700" text-anchor="middle">请求：GET /index.html HTTP/1.1</text><rect x="652" y="110" width="548" height="62" rx="12" fill="#e7f8ef" stroke="#78b894" stroke-width="2"/><text x="926.0" y="147.0" fill="#1b314c" font-size="18" font-weight="700" text-anchor="middle">响应：HTTP/1.1 200 OK</text><rect x="45" y="182" width="548" height="170" rx="8" fill="#f7faff" stroke="#cedae9"/><text x="73" y="220" fill="#1b314c" font-size="19" font-weight="400" text-anchor="start">Host: example.com</text><text x="73" y="262" fill="#1b314c" font-size="19" font-weight="400" text-anchor="start">Accept: text/html</text><text x="73" y="304" fill="#1b314c" font-size="19" font-weight="400" text-anchor="start">Cookie: sid=abc（可选）</text><text x="73" y="343" fill="#6d7c8b" font-size="16" font-weight="400" text-anchor="start">空行 CRLF：分隔首部与消息体</text><rect x="45" y="368" width="548" height="78" rx="12" fill="#f6f7fa" stroke="#d5dce4" stroke-width="2"/><text x="319.0" y="413.0" fill="#1b314c" font-size="18" font-weight="700" text-anchor="middle">可选消息体</text><rect x="652" y="182" width="548" height="170" rx="8" fill="#f7faff" stroke="#cedae9"/><text x="680" y="220" fill="#1b314c" font-size="19" font-weight="400" text-anchor="start">Content-Type: text/html</text><text x="680" y="262" fill="#1b314c" font-size="19" font-weight="400" text-anchor="start">Content-Length: 25</text><text x="680" y="304" fill="#1b314c" font-size="19" font-weight="400" text-anchor="start">Set-Cookie: sid=abc（可选）</text><text x="680" y="343" fill="#6d7c8b" font-size="16" font-weight="400" text-anchor="start">空行 CRLF：分隔首部与消息体</text><rect x="652" y="368" width="548" height="78" rx="12" fill="#f6f7fa" stroke="#d5dce4" stroke-width="2"/><text x="926.0" y="413.0" fill="#1b314c" font-size="18" font-weight="700" text-anchor="middle">响应内容（若有）</text><text x="623" y="493" fill="#586b80" font-size="18" font-weight="400" text-anchor="middle">HTTP/1.1 文本报文示意：HTTP/2、HTTP/3 的线上帧格式不同。</text><text x="623" y="523" fill="#586b80" font-size="16" font-weight="400" text-anchor="middle">响应状态码由三位数字表示；请求是否含消息体，取决于方法和具体语义。</text></svg>