<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="355" version="1.1" viewBox="0 0 900 355" width="900" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-dark" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M1,1 L9,5 L1,9 Z" fill="#192338" /></marker><marker id="arrow-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M1,1 L9,5 L1,9 Z" fill="#dc3545" /></marker></defs><rect fill="white" height="353" rx="16" stroke="#dce4ef" stroke-width="2" width="898" x="1" y="1" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" x="28" y="40">简单图与多重图：不要混淆反向弧与重边</text><rect fill="#2563eb" height="3" rx="2" width="32" x="28" y="51" /><text fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="13" x="28" y="76">简单图：无自环、无相同端点重复边；有向图的两个反向弧并不是重复弧</text><rect fill="#f7f9fc" height="116" rx="11" stroke="#dce4ef" stroke-width="1.2" width="420" x="22" y="83" /><text fill="#16866b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" x="39" y="108">有向图：A↔B 允许</text><line marker-end="url(#arrow-dark)" stroke="#192338" stroke-width="1.8" x1="150.0" x2="304.0" y1="149.0" y2="149.0" /><line marker-end="url(#arrow-dark)" stroke="#192338" stroke-width="1.8" x1="304.0" x2="150.0" y1="167.0" y2="167.0" /><circle cx="132" cy="158" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="132" y="163">A</text><circle cx="322" cy="158" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="322" y="163">B</text><rect fill="#f7f9fc" height="116" rx="11" stroke="#dce4ef" stroke-width="1.2" width="420" x="465" y="83" /><text fill="#dc3545" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" x="482" y="108">有向图：重复 A→B 不允许</text><line marker-end="url(#arrow-dark)" stroke="#192338" stroke-width="1.8" x1="593.0" x2="747.0" y1="149.0" y2="149.0" /><line marker-end="url(#arrow-red)" stroke="#dc3545" stroke-width="3" x1="593.0" x2="747.0" y1="167.0" y2="167.0" /><circle cx="575" cy="158" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="575" y="163">A</text><circle cx="765" cy="158" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="765" y="163">B</text><rect fill="#f7f9fc" height="116" rx="11" stroke="#dce4ef" stroke-width="1.2" width="420" x="22" y="213" /><text fill="#16866b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" x="39" y="238">无向图：A—B 是一条边</text><line stroke="#192338" stroke-width="2" x1="132" x2="322" y1="288" y2="288" /><circle cx="132" cy="288" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="132" y="293">A</text><circle cx="322" cy="288" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="322" y="293">B</text><rect fill="#f7f9fc" height="116" rx="11" stroke="#dce4ef" stroke-width="1.2" width="420" x="465" y="213" /><text fill="#dc3545" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" x="482" y="238">任意自环：A→A 不允许</text><circle cx="665" cy="289" fill="#ffffff" r="21" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="665" y="294">A</text><path d="M 675,271 C 755,199 750,314 689,292" fill="none" marker-end="url(#arrow-red)" stroke="#dc3545" stroke-width="2.7" /></svg>