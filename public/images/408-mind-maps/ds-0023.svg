<text x="480" y="84" font-size="14" fill="#18181b" font-weight="700">② 编码  abcaaadeaaaff</text>
<text x="480" y="110" font-size="13" fill="#7856c9" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">1 0000 0001 111 0010 0011 111 01 01</text>
<text x="480" y="132" font-size="12.5" fill="#71717a">共 27 bit；前缀码，解码时从根沿树走到叶</text>
<text x="480" y="180" font-size="14" fill="#18181b" font-weight="700">③ WPL</text>
<text x="480" y="206" font-size="14" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">(1+1+1+1)×4 + 2×2 + 7×1 = <tspan font-weight="700">27</tspan></text>
<text x="480" y="254" font-size="14" fill="#18181b" font-weight="700">④ 压缩率（char 占 8 bit）</text>
<text x="480" y="280" font-size="14" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">27 ÷ (13 × 8) = 27 / 104 ≈ <tspan font-weight="700">26%</tspan></text>
<text x="480" y="328" font-size="14" fill="#18181b" font-weight="700">⑤ 定长编码对比</text>
<text x="480" y="354" font-size="14" fill="#3f3f46">6 个字符需 ⌈log₂6⌉ = 3 bit</text>
<text x="480" y="378" font-size="14" fill="#3f3f46">3 ÷ 8 = 37.5%，哈夫曼编码更省</text>
