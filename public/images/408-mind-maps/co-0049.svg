<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="控制存储器 CM：由 ROM 组成，按地址存放各条指令的微程序">
<title>控制存储器 CM：由 ROM 组成，按地址存放各条指令的微程序</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="558.5" height="258.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">控制存储器 CM（按地址寻访）</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="200" y="60" width="160" height="26" rx="0" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="280" y="77.2" font-size="12" fill="#3f3f46" text-anchor="middle">…</text>
<rect x="200" y="86" width="160" height="50" rx="0" fill="#efe9fb" stroke="#7856c9" stroke-width="1.5"/>
<text x="280" y="115.2" font-size="12" fill="#3b0764" text-anchor="middle">指令 1 的微程序</text>
<rect x="200" y="136" width="160" height="50" rx="0" fill="#efe9fb" stroke="#7856c9" stroke-width="1.5"/>
<text x="280" y="165.2" font-size="12" fill="#3b0764" text-anchor="middle">指令 2 的微程序</text>
<rect x="200" y="186" width="160" height="26" rx="0" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="280" y="203.2" font-size="12" fill="#3f3f46" text-anchor="middle">…</text>
<path d="M80 100L198 100" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="74" y="104.5" font-size="13" fill="#18181b" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">P</text>
<path d="M80 150L198 150" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="74" y="154.6" font-size="13" fill="#18181b" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">K</text>
<text x="60" y="70" font-size="12" fill="#71717a">地址</text>
<text x="380" y="136" font-size="12" fill="#3f3f46"><tspan x="380" dy="0">每段由若干微指令</tspan><tspan x="380" dy="18">顺序组成</tspan></text>
<text x="280" y="238" font-size="11.5" fill="#71717a" text-anchor="middle">微程序就像存在主存中的程序；P、K 为微程序的入口地址</text>
</svg>
