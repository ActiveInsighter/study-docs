<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 400" width="870" height="400" role="img" aria-labelledby="title"><title id="title">指令微程序存储在控制存储器中</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#172033" font-size="20"><rect x="280" y="70" width="230" height="250" rx="0" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><line x1="280" y1="100" x2="510" y2="100" stroke="#475569" stroke-width="2"/><line x1="280" y1="195" x2="510" y2="195" stroke="#475569" stroke-width="2"/><line x1="280" y1="290" x2="510" y2="290" stroke="#475569" stroke-width="2"/><text x="395" y="92" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">…</text><text x="395" y="148" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">指令 1 的微程序</text><text x="395" y="242" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">指令 2 的微程序</text><text x="395" y="313" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">…</text><line x1="145" y1="100" x2="273" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="145" y1="195" x2="273" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="115" y="107" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">P</text><text x="115" y="202" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">K</text><text x="95" y="48" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">地址</text><text x="395" y="367" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">CM（按地址寻访）</text><text x="665" y="190" text-anchor="middle" font-size="20" font-weight="400" fill="#172033">每段由微指令序列组成</text></g></svg>