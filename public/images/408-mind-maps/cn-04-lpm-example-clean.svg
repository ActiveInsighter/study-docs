<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460" version="1.1" viewBox="0 0 1040 460" width="1040" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="460" rx="14" stroke="#d3dfeb" stroke-width="1.5" width="1040" x="0" y="0" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="30" y="45">最长前缀匹配 LPM｜不是“第一条命中即结束”</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" text-anchor="start" x="30" y="73">目的地址：192.168.1.130；即使四条路由都可匹配，必须选前缀最长的 /25。</text><line stroke="#d3dfeb" stroke-width="2" x1="30" x2="1010" y1="88" y2="88" /><rect fill="#e7efff" height="47" rx="8" stroke="#9db9ed" stroke-width="1.2" width="610" x="36" y="106" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="start" x="66" y="136">目的网络</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="start" x="334" y="136">下一跳</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="start" x="473" y="136">是否匹配</text><rect fill="#f7faff" height="57" rx="4" stroke="#d3dfeb" stroke-width="1" width="610" x="36" y="158" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start" x="62" y="194">192.168.0.0/16</text><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="start" x="350" y="194">→ A</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="479" y="193">匹配</text><rect fill="#f7faff" height="57" rx="4" stroke="#d3dfeb" stroke-width="1" width="610" x="36" y="220" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start" x="62" y="256">192.168.1.0/24</text><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="start" x="350" y="256">→ B</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="479" y="255">匹配</text><rect fill="#ddf8ec" height="57" rx="4" stroke="#5fc49a" stroke-width="2" width="610" x="36" y="282" /><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="start" x="62" y="318">192.168.1.128/25</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="start" x="350" y="318">→ C</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="start" x="479" y="317">✓ 最具体</text><rect fill="#f7faff" height="57" rx="4" stroke="#d3dfeb" stroke-width="1" width="610" x="36" y="344" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start" x="62" y="380">0.0.0.0/0</text><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="start" x="350" y="380">→ D</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="479" y="379">匹配</text><rect fill="#f3f8ff" height="264" rx="8" stroke="#adc5ed" stroke-width="1.2" width="324" x="679" y="129" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" text-anchor="start" x="705" y="164">LPM 决策步骤</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="705" y="208">1  对目的 IP 逐项比前缀</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="705" y="257">2  找出全部匹配路由</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="start" x="705" y="306">3  选择最长的 /25</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="start" x="705" y="355">4  出口下一跳 C</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="35" y="439">前缀更长 = 覆盖范围更窄； /0 是兜底，/32 是单地址。</text></svg>