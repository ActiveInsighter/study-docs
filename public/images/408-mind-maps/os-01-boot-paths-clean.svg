<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540" version="1.1" viewBox="0 0 1240 540" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>两条典型启动链：BIOS/MBR 与 UEFI/GPT</title><defs><marker id="arw" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#475569" /></marker></defs><rect fill="#ffffff" height="538" rx="22" stroke="#dbe3ed" stroke-width="2" width="1238" x="1" y="1" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="bold" text-anchor="start" x="32" y="41">两条典型启动链：BIOS/MBR 与 UEFI/GPT</text><text fill="#475569" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="32" y="68">引导器加载内核前，固件负责建立初始执行环境；现代计算机不必按传统MBR活动分区链启动</text><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="62" y="113">传统 BIOS + MBR</text><rect fill="#f8fafc" height="365" rx="16" stroke="#e2e8f0" stroke-width="1.7" width="559" x="34" y="123" /><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="671" y="113">现代 UEFI + GPT</text><rect fill="#f8fafc" height="365" rx="16" stroke="#e2e8f0" stroke-width="1.7" width="559" x="643" y="123" /><rect fill="#eff6ff" height="48" rx="14" stroke="#2563eb" stroke-width="2" width="516" x="55" y="139" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="313.0" y="169.3">处理器复位 → BIOS 固件执行</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="313" x2="313" y1="188" y2="204" /><rect fill="#eff6ff" height="48" rx="14" stroke="#2563eb" stroke-width="2" width="516" x="55" y="207" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="313.0" y="237.3">硬件初始化、启动设备选择</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="313" x2="313" y1="256" y2="272" /><rect fill="#eff6ff" height="48" rx="14" stroke="#2563eb" stroke-width="2" width="516" x="55" y="275" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="313.0" y="305.3">读取 MBR 引导代码 / 分区表</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="313" x2="313" y1="324" y2="340" /><rect fill="#eff6ff" height="48" rx="14" stroke="#2563eb" stroke-width="2" width="516" x="55" y="343" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="313.0" y="373.3">可能加载活动分区 PBR 或后续引导程序</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="313" x2="313" y1="392" y2="408" /><rect fill="#eff6ff" height="48" rx="14" stroke="#2563eb" stroke-width="2" width="516" x="55" y="411" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="313.0" y="441.3">Bootloader 加载 OS 内核</text><rect fill="#ecfdf5" height="48" rx="14" stroke="#0f766e" stroke-width="2" width="516" x="664" y="139" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="922.0" y="169.3">处理器复位 → UEFI 固件执行</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="922" x2="922" y1="188" y2="204" /><rect fill="#ecfdf5" height="48" rx="14" stroke="#0f766e" stroke-width="2" width="516" x="664" y="207" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="922.0" y="237.3">读取固件启动配置 / GPT信息</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="922" x2="922" y1="256" y2="272" /><rect fill="#ecfdf5" height="48" rx="14" stroke="#0f766e" stroke-width="2" width="516" x="664" y="275" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="922.0" y="305.3">定位 EFI 系统分区 ESP</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="922" x2="922" y1="324" y2="340" /><rect fill="#ecfdf5" height="48" rx="14" stroke="#0f766e" stroke-width="2" width="516" x="664" y="343" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="922.0" y="373.3">加载并执行 EFI 启动应用</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="922" x2="922" y1="392" y2="408" /><rect fill="#ecfdf5" height="48" rx="14" stroke="#0f766e" stroke-width="2" width="516" x="664" y="411" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="922.0" y="441.3">Bootloader / EFI程序加载内核</text><text fill="#475569" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="35" y="516">传统链条可能还涉及PBR；UEFI可直接调用EFI程序。两者都是“示意”，不覆盖所有平台启动方案。</text></svg>