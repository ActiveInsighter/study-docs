<text x="400" y="64" font-size="12" fill="#d1493a">磁头臂整体移动</text>
<text x="400" y="110" font-size="12" fill="#3f3f46">每个盘面对应一个磁头；</text>
<text x="400" y="132" font-size="12" fill="#3f3f46">所有磁头连在同一个磁臂上，</text>
<text x="400" y="154" font-size="12" fill="#3f3f46">因此所有磁头“共进退”</text>
<text x="400" y="212" font-size="12" fill="#2f8f57" font-weight="600">所有盘面中相对位置相同的</text>
<text x="400" y="234" font-size="12" fill="#2f8f57" font-weight="600">磁道（绿色虚线）组成柱面</text>
<text x="310" y="344" font-size="12" fill="#71717a" text-anchor="middle">一个盘片可能有两个盘面；磁盘地址：⟨柱面号, 盘面号, 扇区号⟩</text>
