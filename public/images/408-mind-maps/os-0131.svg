<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 306" width="560" height="306" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="DMA 方式">
<title>DMA 方式</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="558.5" height="304.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">DMA 方式</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="60" y="70" width="190" height="40" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="155" y="94.4" font-size="12.5" fill="#18181b" text-anchor="middle">给 I/O 控制器发出读块命令</text>
<rect x="60" y="132" width="190" height="40" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="155" y="156.4" font-size="12.5" fill="#18181b" text-anchor="middle">读 DMA 控制器的状态</text>
<path d="M155 110L155 131" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="60" y="194" width="190" height="40" rx="6" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="155" y="218.4" font-size="12.5" fill="#18181b" text-anchor="middle">下一条指令</text>
<path d="M155 172L155 193" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="276" y="94.2" font-size="12" fill="#d1493a" font-weight="600">CPU → DMA；CPU 去做其他事情</text>
<text x="276" y="148.4" font-size="12" fill="#d1493a" font-weight="600"><tspan x="276" dy="0">DMA 控制器发出中断</tspan><tspan x="276" dy="15.6">DMA → CPU</tspan></text>
<text x="280" y="286" font-size="11.5" fill="#71717a" text-anchor="middle">以块为单位传送，只在一块开始和结束时需要 CPU 干预</text>
</svg>
