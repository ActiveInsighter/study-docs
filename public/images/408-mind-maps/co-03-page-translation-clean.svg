<svg xmlns="http://www.w3.org/2000/svg" width="960" height="395" viewBox="0 0 960 395" role="img" aria-label="co-03-page-translation-clean.svg"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#446d9b" stroke-width="2" /></marker></defs><rect x="0" y="0" width="960" height="395" rx="20" fill="#fff" stroke="#d5e0ea" stroke-width="2" /><text x="30" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10283d">虚拟地址→物理地址：页内偏移不变化</text><line x1="30" y1="53" x2="930" y2="53" stroke="#d9e5ef" stroke-width="2"/><text x="31" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526579">32位虚址、4KiB页（偏移12位）：虚页号20位；物理页框号按物理内存规模确定</text><rect x="90" y="145" width="500" height="70" rx="4" fill="#e3eeff" stroke="#9db4c7" stroke-width="2" /><text x="340.0" y="177" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#18354d">虚页号 VPN</text><text x="340.0" y="203" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">20位</text><rect x="590" y="145" width="275" height="70" rx="4" fill="#dff4e9" stroke="#9db4c7" stroke-width="2" /><text x="727.5" y="177" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#18354d">页内偏移</text><text x="727.5" y="203" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">12位</text><rect x="90" y="272" width="500" height="70" rx="4" fill="#fff0dc" stroke="#9db4c7" stroke-width="2" /><text x="340.0" y="304" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#18354d">物理页框号 PFN</text><text x="340.0" y="330" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">例：20位</text><rect x="590" y="272" width="275" height="70" rx="4" fill="#dff4e9" stroke="#9db4c7" stroke-width="2" /><text x="727.5" y="304" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#18354d">页内偏移</text><text x="727.5" y="330" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">12位</text><line x1="335" y1="220" x2="335" y2="269" stroke="#446d9b" stroke-width="3" marker-end="url(#arrow)" /><text x="353" y="246" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#2f6194">TLB / 页表</text><line x1="723" y1="220" x2="723" y2="269" stroke="#446d9b" stroke-width="3" marker-end="url(#arrow)" /><text x="740" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#28734c">原样保持</text><text x="36" y="365" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#456178">物理地址 = PFN × 页大小 + 原页内偏移；PFN来自合法有效的映射</text></svg>