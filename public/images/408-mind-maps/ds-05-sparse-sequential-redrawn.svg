<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="右斜树的层序下标 1 3 7 15，顺序存储可能指数级浪费"><rect width="880" height="380" fill="#ffffff"/><text x="34" y="43" font-size="21" text-anchor="start" fill="#233042" font-family="Noto Sans CJK SC, sans-serif" font-weight="700">非完全二叉树：用层序位置顺序存储可能浪费严重</text><path d="M137 117 L182 149" stroke="#7e8ca2" stroke-width="2" fill="none"/><path d="M206 173 L251 205" stroke="#7e8ca2" stroke-width="2" fill="none"/><path d="M275 229 L320 261" stroke="#7e8ca2" stroke-width="2" fill="none"/><circle cx="125" cy="105" r="20" fill="#edf4ff" stroke="#467ac4" stroke-width="1.7"/><text x="125" y="111" font-size="16" text-anchor="middle" fill="#21467c" font-family="Noto Sans CJK SC, sans-serif" font-weight="650">1</text><circle cx="194" cy="161" r="20" fill="#edf4ff" stroke="#467ac4" stroke-width="1.7"/><text x="194" y="167" font-size="16" text-anchor="middle" fill="#21467c" font-family="Noto Sans CJK SC, sans-serif" font-weight="650">3</text><circle cx="263" cy="217" r="20" fill="#edf4ff" stroke="#467ac4" stroke-width="1.7"/><text x="263" y="223" font-size="16" text-anchor="middle" fill="#21467c" font-family="Noto Sans CJK SC, sans-serif" font-weight="650">7</text><circle cx="332" cy="273" r="20" fill="#edf4ff" stroke="#467ac4" stroke-width="1.7"/><text x="332" y="279" font-size="16" text-anchor="middle" fill="#21467c" font-family="Noto Sans CJK SC, sans-serif" font-weight="650">15</text><text x="55" y="324" font-size="16" text-anchor="start" fill="#233042" font-family="Noto Sans CJK SC, sans-serif" font-weight="500">仅 4 个实际结点，但末端编号已经是 15</text><rect x="424" y="85" width="422" height="263" rx="16" fill="#f5f8ff" stroke="#d1ddf6"/><text x="446" y="123" font-size="18" text-anchor="start" fill="#284568" font-family="Noto Sans CJK SC, sans-serif" font-weight="650">1 基数组示意：</text><text x="446" y="157" font-size="16" text-anchor="start" fill="#284568" font-family="Noto Sans CJK SC, sans-serif" font-weight="500">根 = a[1]；只有右孩子 → 2i+1</text><text x="446" y="193" font-size="16" text-anchor="start" fill="#284568" font-family="Noto Sans CJK SC, sans-serif" font-weight="500">右斜链：1 → 3 → 7 → 15 → …</text><text x="446" y="239" font-size="16" text-anchor="start" fill="#b14734" font-family="Noto Sans CJK SC, sans-serif" font-weight="650">高度 h（层数），最深编号 = 2^h − 1</text><text x="446" y="276" font-size="16" text-anchor="start" fill="#b14734" font-family="Noto Sans CJK SC, sans-serif" font-weight="500">仅 h 个结点，却可能需要 2^h − 1 个槽位</text><text x="446" y="317" font-size="16" text-anchor="start" fill="#284568" font-family="Noto Sans CJK SC, sans-serif" font-weight="500">所以一般二叉树更适合链式存储。</text></svg>