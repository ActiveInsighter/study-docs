<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="590" version="1.1" viewBox="0 0 1310 590" width="1310" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>三种常见运行栈：Type 1、Type 2 与容器</title><defs><marker id="arw" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#475569" /></marker></defs><rect fill="#ffffff" height="588" rx="22" stroke="#dbe3ed" stroke-width="2" width="1308" x="1" y="1" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="bold" text-anchor="start" x="32" y="41">三种常见运行栈：Type 1、Type 2 与容器</text><text fill="#475569" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="32" y="68">Hypervisor为客户机呈现虚拟硬件；容器通常共享宿主内核，二者隔离边界不同</text><rect fill="#f8fafc" height="455" rx="18" stroke="#e2e8f0" stroke-width="1.8" width="402" x="22" y="93" /><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="38" y="124">Type 1 · 裸机型</text><rect fill="#f8fafc" height="455" rx="18" stroke="#e2e8f0" stroke-width="1.8" width="402" x="452" y="93" /><text fill="#7c3aed" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="468" y="124">Type 2 · 宿主型</text><rect fill="#f8fafc" height="455" rx="18" stroke="#e2e8f0" stroke-width="1.8" width="402" x="882" y="93" /><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="898" y="124">容器（OS级）</text><rect fill="#eff6ff" height="55" rx="14" stroke="#2563eb" stroke-width="2" width="368" x="39" y="141" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="223.0" y="174.45">应用 / 业务进程</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="223" x2="223" y1="197" y2="215" /><rect fill="#eff6ff" height="55" rx="14" stroke="#2563eb" stroke-width="2" width="368" x="39" y="218" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="223.0" y="251.45">客户操作系统 Guest OS</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="223" x2="223" y1="274" y2="292" /><rect fill="#f5f3ff" height="55" rx="14" stroke="#2563eb" stroke-width="2" width="368" x="39" y="295" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="223.0" y="328.45">Hypervisor / VMM</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="223" x2="223" y1="351" y2="369" /><rect fill="#f5f3ff" height="55" rx="14" stroke="#2563eb" stroke-width="2" width="368" x="39" y="372" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="223.0" y="405.45">物理硬件</text><text fill="#475569" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="223" y="467">可存在管理域，但非普通宿主层</text><rect fill="#eff6ff" height="55" rx="14" stroke="#7c3aed" stroke-width="2" width="368" x="469" y="141" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="653.0" y="174.45">应用 / 业务进程</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="653" x2="653" y1="197" y2="215" /><rect fill="#eff6ff" height="55" rx="14" stroke="#7c3aed" stroke-width="2" width="368" x="469" y="218" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="653.0" y="251.45">客户操作系统 Guest OS</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="653" x2="653" y1="274" y2="292" /><rect fill="#f5f3ff" height="55" rx="14" stroke="#7c3aed" stroke-width="2" width="368" x="469" y="295" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="653.0" y="328.45">宿主上的VMM进程</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="653" x2="653" y1="351" y2="369" /><rect fill="#f5f3ff" height="55" rx="14" stroke="#7c3aed" stroke-width="2" width="368" x="469" y="372" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="653.0" y="405.45">宿主操作系统 Host OS</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="653" x2="653" y1="428" y2="446" /><rect fill="#ecfdf5" height="55" rx="14" stroke="#7c3aed" stroke-width="2" width="368" x="469" y="449" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="653.0" y="482.45">物理硬件</text><rect fill="#eff6ff" height="55" rx="14" stroke="#0f766e" stroke-width="2" width="368" x="899" y="141" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1083.0" y="174.45">容器内应用进程</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="1083" x2="1083" y1="197" y2="215" /><rect fill="#eff6ff" height="55" rx="14" stroke="#0f766e" stroke-width="2" width="368" x="899" y="218" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1083.0" y="251.45">命名空间 / 资源限额隔离</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="1083" x2="1083" y1="274" y2="292" /><rect fill="#f5f3ff" height="55" rx="14" stroke="#0f766e" stroke-width="2" width="368" x="899" y="295" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1083.0" y="328.45">容器运行时 / 管理工具</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="1083" x2="1083" y1="351" y2="369" /><rect fill="#f5f3ff" height="55" rx="14" stroke="#0f766e" stroke-width="2" width="368" x="899" y="372" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1083.0" y="405.45">共享宿主 OS 内核</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="1083" x2="1083" y1="428" y2="446" /><rect fill="#ecfdf5" height="55" rx="14" stroke="#0f766e" stroke-width="2" width="368" x="899" y="449" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1083.0" y="482.45">物理硬件</text><text fill="#475569" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="23" y="574">记忆：第一类直接控制硬件；第二类依托宿主OS；容器并不自带独立的客户内核。</text></svg>