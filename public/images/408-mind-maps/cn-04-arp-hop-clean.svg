<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="504" version="1.1" viewBox="0 0 1100 504" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="504" rx="14" stroke="#d3dfeb" stroke-width="1.5" width="1100" x="0" y="0" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="30" y="45">跨网络IP通信｜端到端 IP 不变，链路帧的 MAC 逐跳变化</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" text-anchor="start" x="30" y="73">假设不使用NAT，三段都是以太网；每段ARP解析的都是该段下一跳IPv4地址。</text><line stroke="#d3dfeb" stroke-width="2" x1="30" x2="1070" y1="88" y2="88" /><rect fill="#e9f2ff" height="74" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="165" x="95" y="124" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="177" y="169">主机 A</text><rect fill="#e1f8ef" height="74" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="165" x="366" y="124" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="448" y="169">路由器 R1</text><rect fill="#e1f8ef" height="74" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="165" x="630" y="124" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="712" y="169">路由器 R2</text><rect fill="#e9f2ff" height="74" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="165" x="905" y="124" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="987" y="169">主机 C</text><line stroke="#2463eb" stroke-width="3" x1="260" x2="366" y1="162" y2="162" /><polygon fill="#2463eb" points="366.0,162.0 356.3465918192059,156.72631907535376 356.3465918192059,167.27368092464624" /><line stroke="#2463eb" stroke-width="3" x1="531" x2="630" y1="162" y2="162" /><polygon fill="#2463eb" points="630.0,162.0 620.3465918192059,156.72631907535376 620.3465918192059,167.27368092464624" /><line stroke="#2463eb" stroke-width="3" x1="795" x2="905" y1="162" y2="162" /><polygon fill="#2463eb" points="905.0,162.0 895.3465918192059,156.72631907535376 895.3465918192059,167.27368092464624" /><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="313.0" y="116">本地LAN</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="580.5" y="116">中间LAN</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="850.0" y="116">目的LAN</text><rect fill="#f7faff" height="134" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="317" x="30" y="234" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="45" y="267">第一跳  A → R1</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="45" y="302">MAC 源=A；目的=R1入口</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="start" x="45" y="341">IP 源=A，IP 目的=C</text><rect fill="#f7faff" height="134" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="317" x="395" y="234" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="410" y="267">第二跳  R1 → R2</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="410" y="302">MAC 源=R1出口；目的=R2入口</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="start" x="410" y="341">IP 源=A，IP 目的=C</text><rect fill="#f7faff" height="134" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="317" x="755" y="234" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="770" y="267">第三跳  R2 → C</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="770" y="302">MAC 源=R2出口；目的=C</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="start" x="770" y="341">IP 源=A，IP 目的=C</text><rect fill="#edf8f4" height="68" rx="8" stroke="#98d6c4" stroke-width="1.2" width="1010" x="45" y="402" /><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="63" y="443">核心：下一跳MAC通过本段ARP获取；路由器收帧 → 按IP选路 → 重新封装下一段链路帧。</text></svg>