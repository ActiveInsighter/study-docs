<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" role="img" aria-label="经典冯诺依曼机的功能部件和概念关系，运算器、存储器、控制器、输入设备、输出设备">
<title>经典冯·诺依曼五大部件示意</title>
<defs>
 <marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#1d4ed8"/></marker>
 <marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#be123c"/></marker>
</defs>
<rect x="1.5" y="1.5" width="937" height="437" rx="19" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
<text x="32" y="45" font-size="24" font-weight="700" fill="#0f172a">经典冯·诺依曼模型：五大功能部件</text>
<text x="33" y="76" font-size="16" fill="#64748b">以运算器为中心是历史上的简化描述；连线表示概念性交互，不代表现代机器的实际全部通路</text>
<!-- boxes -->
<rect x="70" y="167" width="155" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="147" y="212" text-anchor="middle" font-size="22" fill="#1e3a8a" font-weight="600">输入设备</text>
<rect x="378" y="167" width="184" height="80" rx="13" fill="#fef2f2" stroke="#e11d48" stroke-width="2.5"/>
<text x="470" y="212" text-anchor="middle" font-size="23" fill="#9f1239" font-weight="700">运算器 ALU</text>
<rect x="715" y="167" width="155" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="792" y="212" text-anchor="middle" font-size="22" fill="#1e3a8a" font-weight="600">输出设备</text>
<rect x="378" y="100" width="184" height="52" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="470" y="133" text-anchor="middle" font-size="20" fill="#065f46" font-weight="700">存储器</text>
<rect x="378" y="264" width="184" height="64" rx="11" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
<text x="470" y="304" text-anchor="middle" font-size="21" fill="#9a3412" font-weight="700">控制器 CU</text>
<!-- data paths -->
<path d="M225 207 H371" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ad)"/>
<path d="M563 207 H708" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ad)"/>
<path d="M451 152 V160" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ad)"/>
<path d="M489 167 V159" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ad)"/>
<text x="294" y="197" text-anchor="middle" font-size="15" fill="#1e40af">输入数据</text>
<text x="639" y="197" text-anchor="middle" font-size="15" fill="#1e40af">处理结果</text>
<!-- control dashed path below avoiding labels -->
<path d="M470 264 V250" stroke="#be123c" stroke-dasharray="6 5" stroke-width="2.5" fill="none" marker-end="url(#ac)"/>
<path d="M378 297 H147 V255" stroke="#be123c" stroke-dasharray="6 5" stroke-width="2" fill="none" marker-end="url(#ac)"/>
<path d="M562 297 H792 V255" stroke="#be123c" stroke-dasharray="6 5" stroke-width="2" fill="none" marker-end="url(#ac)"/>
<text x="40" y="368" font-size="17" font-weight="600" fill="#334155">图例</text>
<path d="M99 360 H166" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ad)"/>
<text x="183" y="367" font-size="17" fill="#334155">典型数据通路</text>
<path d="M383 360 H449" stroke="#be123c" stroke-dasharray="6 5" stroke-width="2.5" marker-end="url(#ac)"/>
<text x="465" y="367" font-size="17" fill="#334155">概念控制信号</text>
<text x="34" y="413" font-size="16" fill="#64748b">现代计算机一般以存储器为数据交换中心，CPU和I/O通路及控制信号由具体实现决定。</text>
</svg>