<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="中断驱动方式">
<title>中断驱动方式</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="558.5" height="518.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">中断驱动方式</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="60" y="70" width="190" height="40" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="155" y="94.4" font-size="12.5" fill="#18181b" text-anchor="middle">给 I/O 模块发出读命令</text>
<rect x="60" y="132" width="190" height="40" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="155" y="156.4" font-size="12.5" fill="#18181b" text-anchor="middle">读 I/O 模块的状态</text>
<path d="M155 110L155 131" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M155.0 188L260 214.0L155.0 240L50 214.0Z" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.3"/>
<text x="155" y="218.4" font-size="12.5" fill="#78350f" text-anchor="middle">检查状态</text>
<path d="M155 172L155 187" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="60" y="256" width="190" height="40" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="155" y="280.4" font-size="12.5" fill="#18181b" text-anchor="middle">从 I/O 模块中读取字</text>
<path d="M155 240L155 255" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="60" y="318" width="190" height="40" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="155" y="342.4" font-size="12.5" fill="#18181b" text-anchor="middle">往存储器中写入字</text>
<path d="M155 296L155 317" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M155.0 374L260 400.0L155.0 426L50 400.0Z" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.3"/>
<text x="155" y="404.4" font-size="12.5" fill="#78350f" text-anchor="middle">完成？</text>
<path d="M155 358L155 373" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="276" y="94.2" font-size="12" fill="#d1493a" font-weight="600">CPU → I/O；CPU 去做其他事情</text>
<text x="276" y="156.2" font-size="12" fill="#d1493a" font-weight="600">I/O 发出中断；I/O → CPU</text>
<text x="276" y="218.2" font-size="12" fill="#d1493a" font-weight="600">错误条件</text>
<text x="276" y="280.2" font-size="12" fill="#3b6fd4">I/O → CPU</text>
<text x="276" y="342.2" font-size="12" fill="#3b6fd4">CPU → 存储器</text>
<text x="280" y="472" font-size="11.5" fill="#71717a" text-anchor="middle">每读一个字产生一次中断，数据仍需经过 CPU</text>
<path d="M55 400L42 400Q36 400 36 394L36 96Q36 90 42 90L58 90" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="42" y="392" font-size="10.5" fill="#3f3f46">否</text>
<path d="M55 214L49.5 214Q44 214 44 208.5L44 158Q44 152 50 152L58 152" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="160" y="442" font-size="11" fill="#3f3f46" text-anchor="middle">是 → 下一条指令</text>
</svg>
