<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460" version="1.1" viewBox="0 0 1040 460" width="1040" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#fff" height="460" rx="16" ry="16" stroke="#d6e0e8" stroke-width="1.4" width="1040" x="0" y="0" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="bold" x="32" y="40">CMP a,b：FLAGS如何控制条件转移</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="normal" x="32" y="68">CMP设置a−b的标志但不保存差；signed与unsigned解释不同</text><rect fill="#ecf7f5" height="75" rx="9" ry="9" stroke="#d6e0e8" stroke-width="1.2" width="303" x="34" y="92" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="185" y="125">CMP a,b  →  a−b</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="185" y="148">ZF  ·  SF  ·  OF  ·  CF</text><line stroke="#087e8b" stroke-width="2.6" x1="338" x2="417" y1="129" y2="129" /><polygon fill="#087e8b" points="417,129 409.5719794658129,134.08178226055531 409.5719794658129,123.91821773944469" /><rect fill="#edf3fa" height="85" rx="9" ry="9" stroke="#d6e0e8" stroke-width="1.2" width="578" x="425" y="89" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="450" y="119">ZF = 是否为零   SF = 最高结果位</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="450" y="148">OF = 有符号溢出   CF = 无符号借位（减法）</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="bold" x="39" y="217">有符号比较（signed）</text><text fill="#2463a1" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="bold" x="543" y="217">无符号比较（unsigned）</text><rect fill="#f2fbf9" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="35" y="239" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="49" y="264">JL</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="137" y="264">SF ≠ OF</text><rect fill="#f2fbf9" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="35" y="282" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="49" y="307">JLE</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="137" y="307">ZF = 1 或 SF ≠ OF</text><rect fill="#f2fbf9" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="35" y="325" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="49" y="350">JG</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="137" y="350">ZF = 0 且 SF = OF</text><rect fill="#f2fbf9" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="35" y="368" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="49" y="393">JGE</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="137" y="393">SF = OF</text><rect fill="#f4f8fe" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="540" y="239" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="554" y="264">JB</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="642" y="264">CF = 1</text><rect fill="#f4f8fe" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="540" y="282" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="554" y="307">JBE</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="642" y="307">CF = 1 或 ZF = 1</text><rect fill="#f4f8fe" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="540" y="325" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="554" y="350">JA</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="642" y="350">CF = 0 且 ZF = 0</text><rect fill="#f4f8fe" height="36" rx="5" ry="5" stroke="#d6e0e8" stroke-width="1.2" width="470" x="540" y="368" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="554" y="393">JAE</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="642" y="393">CF = 0</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="39" y="438">相等：JE / JZ 当 ZF=1，JNE / JNZ 当 ZF=0；不同Jcc不会改变CMP时得到的FLAGS。</text></svg>