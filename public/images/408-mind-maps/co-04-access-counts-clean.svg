<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480" version="1.1" viewBox="0 0 1060 480" width="1060" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#fff" height="480" rx="16" ry="16" stroke="#d6e0e8" stroke-width="1.4" width="1060" x="0" y="0" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="bold" x="32" y="40">不同寻址方式：操作数读取的主存数据访问次数</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="normal" x="32" y="68">下列统计不含取指，不含写回、Cache/TLB、异常和多字节访存细节；只数读取一个源操作数</text><rect fill="#e5eff7" height="47" rx="8" ry="8" width="1020" x="20" y="93" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="38" y="123">方式</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="303" y="123">得到地址/操作数的路径</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="773" y="123">主存读取</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="bold" x="888" y="123">关键前提</text><rect fill="#f8fbfd" height="42" width="1020" x="20" y="143" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="40" y="170">立即数</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="303" y="170">立即数字段 → 操作数</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="804" y="171">0</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="893" y="170">无数据地址EA</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="40" y="213">寄存器直接</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="303" y="213">Ri → 寄存器数据</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="804" y="214">0</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="893" y="213">无主存EA</text><rect fill="#f8fbfd" height="42" width="1020" x="20" y="229" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="40" y="256">主存直接</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="303" y="256">A → M[A]</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="804" y="257">1</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="893" y="256">EA = A</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="40" y="299">寄存器间接</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="303" y="299">Ri → 地址EA → M[EA]</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="804" y="300">1</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="893" y="299">EA = R[i]</text><rect fill="#f8fbfd" height="42" width="1020" x="20" y="315" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="40" y="342">主存间接</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="303" y="342">A → M[A] (EA) → M[EA]</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="804" y="343">2</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="893" y="342">单级间接</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="40" y="385">基址/变址</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="303" y="385">基址/变址 + A → M[EA]</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="804" y="386">1</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="893" y="385">仅计算EA不访存</text><rect fill="#f8fbfd" height="42" width="1020" x="20" y="401" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="40" y="428">PC相对取数</text><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="normal" x="303" y="428">PC_base + A → M[EA]</text><text fill="#087e8b" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="804" y="429">1</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="893" y="428">若是分支则另论</text><text fill="#2463a1" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="30" y="464">一次完整读-改-写：主存读取操作数后还需要额外写回；不能把“读取次数”直接当整条指令总访存。</text></svg>