<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc"><title id="title">单链表后插示意</title><desc id="desc">先设置 s 的 next 指向原后继 q，再将 p 的 next 改为 s</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/></marker></defs>
<rect width="900" height="310" rx="18" fill="#f8fafc"/>
<text x="450" y="40" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#0f172a">在已知结点 p 后插入结点 s</text><rect x="90" y="85" width="150" height="66" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="165" y="126" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#0f172a">p</text><rect x="620" y="85" width="150" height="66" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="695" y="126" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">原后继 q</text><rect x="345" y="195" width="150" height="66" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="420" y="235" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">新结点 s</text><path d="M 240 150 L 345 223" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 495 225 L 620 151" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="80" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#0f766e">② p-&gt;next = s</text><text x="645" y="213" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#0f766e">① s-&gt;next = q</text><text x="450" y="299" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#64748b">先保存原后继，再链接新结点；箭头示意操作完成后的链条</text>
</svg>
