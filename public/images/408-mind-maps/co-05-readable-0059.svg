<text x="690" y="272" font-size="10.5" fill="#3b6fd4">C0 有效</text>
<text x="574" y="287" font-size="10.5" fill="#3f3f46" font-family="Noto Sans CJK SC, sans-serif">(MAR) → 主存</text>
<text x="690" y="287" font-size="10.5" fill="#3b6fd4">C1 有效</text>
