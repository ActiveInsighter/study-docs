<text x="574" y="317" font-size="10.5" fill="#3f3f46" font-family="Noto Sans CJK SC, sans-serif">M(MAR) → MDR</text>
<text x="690" y="317" font-size="10.5" fill="#3b6fd4">C2 有效</text>
<text x="574" y="332" font-size="10.5" fill="#3f3f46" font-family="Noto Sans CJK SC, sans-serif">(MDR) → IR</text>
<text x="690" y="332" font-size="10.5" fill="#3b6fd4">C3 有效</text>
<text x="574" y="347" font-size="10.5" fill="#3f3f46" font-family="Noto Sans CJK SC, sans-serif">OP(IR) → CU</text>
<text x="690" y="347" font-size="10.5" fill="#3b6fd4">C4 有效</text>
