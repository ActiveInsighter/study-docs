<text x="155" y="316.5" font-size="10.5" fill="#78350f" text-anchor="middle"><tspan x="155" dy="0">CPU 与控制器的接口：数据线传</tspan><tspan x="155" dy="14.2">数据，地址线指明设备与寄存器，控</tspan><tspan x="155" dy="14.2">制线发命令</tspan></text>
