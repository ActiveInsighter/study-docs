<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Noto Sans CJK SC, sans-serif" font-size="15" role="img" aria-label="SPOOLing输出井与虚拟打印机工作流">
<title>SPOOLing输出井与虚拟打印机工作流</title>
<rect width="960" height="390" rx="14" fill="#ffffff"/>
<text x="24" y="39" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">SPOOLing：共享打印机不是“多台物理打印机”</text>
<text x="24" y="70" font-size="14" fill="#475569" font-weight="400" text-anchor="start">前台快速提交作业 → 磁盘输出井和排队管理 → 后台串行打印</text>
<rect x="36" y="112" width="212" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.7"/>
<text x="142" y="141" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">进程A：打印作业A</text>
<line x1="248" y1="136" x2="345" y2="136" stroke="#64748b" stroke-width="2" /><polygon points="345,136 338.0,139.8 338.0,132.2" fill="#64748b"/>
<rect x="36" y="182" width="212" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.7"/>
<text x="142" y="211" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">进程B：打印作业B</text>
<line x1="248" y1="206" x2="345" y2="206" stroke="#64748b" stroke-width="2" /><polygon points="345,206 338.0,209.8 338.0,202.2" fill="#64748b"/>
<rect x="36" y="252" width="212" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.7"/>
<text x="142" y="281" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">进程C：打印作业C</text>
<line x1="248" y1="276" x2="345" y2="276" stroke="#64748b" stroke-width="2" /><polygon points="345,276 338.0,279.8 338.0,272.2" fill="#64748b"/>
<rect x="346" y="105" width="258" height="231" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.7"/>
<text x="475" y="133" font-size="20" fill="#92400e" font-weight="700" text-anchor="middle">磁盘：输出井</text>
<rect x="374" y="150" width="202" height="44" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.7"/>
<text x="475" y="178" font-size="14" fill="#92400e" font-weight="400" text-anchor="middle">作业A / 请求控制块</text>
<rect x="374" y="214" width="202" height="44" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.7"/>
<text x="475" y="242" font-size="14" fill="#92400e" font-weight="400" text-anchor="middle">作业B / 请求控制块</text>
<rect x="374" y="278" width="202" height="44" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.7"/>
<text x="475" y="306" font-size="14" fill="#92400e" font-weight="400" text-anchor="middle">作业C / 请求控制块</text>
<line x1="605" y1="220" x2="679" y2="220" stroke="#d97706" stroke-width="2" /><polygon points="679,220 672.0,223.8 672.0,216.2" fill="#d97706"/>
<rect x="680" y="176" width="135" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/>
<text x="747" y="208" font-size="17" fill="#166534" font-weight="700" text-anchor="middle">后台打印</text>
<text x="747" y="234" font-size="15" fill="#166534" font-weight="400" text-anchor="middle">守护进程</text>
<line x1="815" y1="220" x2="869" y2="220" stroke="#16a34a" stroke-width="2" /><polygon points="869,220 862.0,223.8 862.0,216.2" fill="#16a34a"/>
<rect x="871" y="188" width="72" height="62" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.7"/>
<text x="907" y="225" font-size="14" fill="#312e81" font-weight="700" text-anchor="middle">打印机</text>
<text x="36" y="362" font-size="13" fill="#475569" font-weight="400" text-anchor="start">输入井用于输入作业的假脱机缓存；图中演示输出井路径。</text>
</svg>