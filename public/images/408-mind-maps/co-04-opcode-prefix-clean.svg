><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" x="716" y="402">xxxx</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="11.8" font-weight="normal" text-anchor="middle" x="716" y="423">OP</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="797" y="411">OP 16位；全部用完</text><line stroke="#d6e0e8" x1="20" x2="1020" y1="454" y2="454" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" font-weight="normal" x="27" y="475">关键：一地址OP=1111 1100/1101/1110 +4位（48条），或 1111 1111 0000~1101（14条）。</text><text fill="#2463a1" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="13" font-weight="normal" x="27" y="497">容量验证：15×4096 + 12×256 + 62×16 + 32 = 65536个16位编码。</text></svg>