<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="微程序控制器的组成与处理流程">
<title>微程序控制器的组成与处理流程</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="618.5" height="428.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">微程序控制器的组成</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<text x="30" y="60" font-size="12" fill="#3f3f46">→ 至 CPU 内部和系统总线的控制信号</text>
<rect x="330" y="74" width="60" height="26" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="360" y="91.4" font-size="12.5" fill="#1e3a8a" text-anchor="middle">OP</text>
<rect x="390" y="74" width="90" height="26" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="490" y="91.4" font-size="12.5" fill="#18181b">IR</text>
<rect x="20" y="118" width="560" height="280" rx="8" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="340" y="130" width="100" height="44" rx="4" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<text x="390" y="148.1" font-size="12" fill="#78350f" text-anchor="middle"><tspan x="390" dy="0">微地址</tspan><tspan x="390" dy="16.2">形成部件</tspan></text>
<path d="M360 100L360 128" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="340" y="200" width="100" height="34" rx="4" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="390" y="221.4" font-size="12.5" fill="#7f1d1d" text-anchor="middle">顺序逻辑</text>
<path d="M390 176L390 198" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="340" y="262" width="100" height="30" rx="4" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="390" y="281.4" font-size="12.5" fill="#14532d" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">CMAR</text>
<path d="M390 236L390 260" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="340" y="316" width="100" height="30" rx="4" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<text x="390" y="335.4" font-size="12.5" fill="#78350f" text-anchor="middle">地址译码</text>
<path d="M390 294L390 314" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="80" y="300" width="180" height="50" rx="4" fill="#efe9fb" stroke="#7856c9" stroke-width="1.5"/>
<text x="170" y="329.6" font-size="13" fill="#3b0764" text-anchor="middle">控制存储器 CM</text>
<path d="M390 348L390 366Q390 372 384 372L176 372Q170 372 170 366L170 352" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
