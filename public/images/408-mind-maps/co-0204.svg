<text x="125" y="219.4" font-size="12.5" fill="#14532d" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">μOP</text>
<rect x="170" y="200" width="90" height="30" rx="0" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="215" y="219.4" font-size="12.5" fill="#14532d" text-anchor="middle">下地址</text>
<text x="70" y="219.2" font-size="12" fill="#18181b" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">CMDR</text>
<path d="M170 298L170 232" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M215 200L215 192Q215 186 221 186L304 186Q310 186 310 192L310 211Q310 217 316 217L338 217" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M125 198L125 70" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M600 208L442 208" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="560" y="200" font-size="11.5" fill="#3f3f46" text-anchor="middle">标志</text>
<path d="M600 226L442 226" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="560" y="242" font-size="11.5" fill="#3f3f46" text-anchor="middle">CLK</text>
<text x="300" y="418" font-size="10.5" fill="#71717a" text-anchor="middle">OP → 微地址形成部件 → CMAR → 译码 → 从 CM 取微指令到 CMDR → 发出微命令，下地址经顺序逻辑形成下一个微地址</text>
</svg>
