<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="原码恢复余数法的硬件：先上商 1，余数为负再恢复并改商 0">
<title>原码恢复余数法的硬件：先上商 1，余数为负再恢复并改商 0</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker><marker id="a3f3f46s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0.8L1.5 5 10 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="798.5" height="328.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">原码除法（恢复余数法）的硬件</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<text x="40" y="84" font-size="13" fill="#3f3f46">x = 0.1011，y = 0.1101，求 x / y</text>
<text x="40" y="110" font-size="12.5" fill="#3f3f46">|x| = 0.1011，[|y|]<tspan baseline-shift="-22%" font-size="9.5">补</tspan> = 0.1101，[−|y|]<tspan baseline-shift="-22%" font-size="9.5">补</tspan> = 1.0011</text>
<text x="40" y="136" font-size="12.5" fill="#3f3f46">符号单独处理：Q<tspan baseline-shift="-22%" font-size="9.5">s</tspan> = x<tspan baseline-shift="-22%" font-size="9.5">s</tspan> ⊕ y<tspan baseline-shift="-22%" font-size="9.5">s</tspan></text>
<text x="40" y="176" font-size="12.5" fill="#d1493a" font-weight="600">实现方法：上商 0 / 1，得余数，余数末尾补 0</text>
<text x="40" y="202" font-size="12.5" fill="#3f3f46">① (ACC) − (除数) → ACC：求余数</text>
<text x="40" y="226" font-size="12.5" fill="#3f3f46">② 余数为正，上商 1；余数为负，上商 0，</text>
<text x="40" y="248" font-size="12.5" fill="#3f3f46">　 并 (ACC) + |y| 恢复余数</text>
<text x="40" y="272" font-size="12.5" fill="#3f3f46">③ ACC、MQ 一起左移一位，重复 n 次</text>
<text x="40" y="304" font-size="12" fill="#71717a">若最后一步商 0（余数为负），也要恢复余数</text>
<rect x="440" y="60" width="340" height="250" rx="12" fill="none" stroke="#3b6fd4" stroke-width="1.4"/>
<text x="530" y="82" font-size="12" fill="#3f3f46" text-anchor="middle">ACC（被除数、余数）</text>
<text x="700" y="82" font-size="12" fill="#3f3f46" text-anchor="middle">MQ（商）</text>
