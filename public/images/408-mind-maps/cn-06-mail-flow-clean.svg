<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 432" width="1250" height="432" role="img" aria-label="电子邮件：用户代理、提交、服务器转发与收取" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>电子邮件：用户代理、提交、服务器转发与收取</title><rect width="1250" height="432" rx="18" fill="#ffffff"/><rect x="1" y="1" width="1248" height="430" rx="18" fill="none" stroke="#d9e3ec" stroke-width="2"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9z" fill="#3b5c82"/></marker></defs><text x="40" y="50" font-size="26" fill="#182e46" font-weight="700">电子邮件：用户代理、提交、服务器转发与收取</text><line x1="40" y1="67" x2="1210" y2="67" stroke="#e1e8f0" stroke-width="2"/><rect x="50" y="146" width="218" height="97" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="159.0" y="176" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">发件人</text><text x="159.0" y="206" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">邮件用户代理</text><rect x="340" y="146" width="225" height="97" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="452.5" y="176" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">发件邮件服务器</text><text x="452.5" y="206" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">排队/SMTP 客户</text><rect x="650" y="146" width="225" height="97" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="762.5" y="176" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">收件邮件服务器</text><text x="762.5" y="206" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">SMTP 服务端</text><rect x="970" y="146" width="225" height="97" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="1082.5" y="176" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">收件人</text><text x="1082.5" y="206" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">Webmail/客户端</text><line x1="270" y1="192" x2="336" y2="192" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="303.0" y="169" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">提交</text><line x1="568" y1="192" x2="647" y2="192" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="607.5" y="169" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">SMTP</text><line x1="878" y1="192" x2="965" y2="192" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="921.5" y="169" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">读取</text><text x="156" y="289" fill="#1b314c" font-size="16" font-weight="400" text-anchor="middle">HTTP / SMTP Submission</text><text x="453" y="289" fill="#1b314c" font-size="16" font-weight="400" text-anchor="middle">TCP 587 常用</text><text x="762" y="289" fill="#1b314c" font-size="16" font-weight="400" text-anchor="middle">SMTP TCP 25</text><text x="1083" y="289" fill="#1b314c" font-size="15" font-weight="400" text-anchor="middle">IMAP / POP3 / HTTPS</text><rect x="85" y="338" width="460" height="60" rx="12" fill="#f0f6ff" stroke="#8daac9" stroke-width="2"/><text x="315.0" y="374.0" fill="#1b314c" font-size="18" font-weight="700" text-anchor="middle">信封 MAIL FROM、RCPT TO ≠ 邮件头 From、To</text><rect x="695" y="338" width="455" height="60" rx="12" fill="#f0f6ff" stroke="#8daac9" stroke-width="2"/><text x="922.5" y="374.0" fill="#1b314c" font-size="18" font-weight="700" text-anchor="middle">MIME 处理附件/内容编码；TLS 保护传输</text></svg>