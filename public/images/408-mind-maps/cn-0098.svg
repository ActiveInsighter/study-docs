<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="TCP 连接释放：四次挥手，客户端最后等待 2MSL">
<title>TCP 连接释放：四次挥手，客户端最后等待 2MSL</title>
<defs><marker id="a2f8f57" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#2f8f57"/></marker><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker><marker id="ad1493a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#d1493a"/></marker></defs>
<rect x="0.75" y="0.75" width="698.5" height="438.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">TCP 连接释放（四次挥手）</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<text x="160" y="56" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="600">客户机 A</text>
<text x="540" y="56" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="600">服务器 B</text>
<path d="M160 66L160 420" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M540 66L540 420" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="110" y="72" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="86.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="160" dy="0">ESTAB-</tspan><tspan x="160" dy="14.9">LISHED</tspan></text>
<rect x="110" y="142" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="163.8" font-size="11" fill="#18181b" text-anchor="middle">FIN-WAIT-1</text>
<rect x="110" y="232" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="253.8" font-size="11" fill="#18181b" text-anchor="middle">FIN-WAIT-2</text>
<rect x="110" y="312" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="333.9" font-size="11" fill="#18181b" text-anchor="middle">TIME-WAIT</text>
<rect x="110" y="382" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="160" y="403.9" font-size="11" fill="#18181b" text-anchor="middle">CLOSED</text>
<rect x="490" y="72" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="86.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="540" dy="0">ESTAB-</tspan><tspan x="540" dy="14.9">LISHED</tspan></text>
<rect x="490" y="192" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="213.8" font-size="11" fill="#18181b" text-anchor="middle">CLOSE-WAIT</text>
<rect x="490" y="292" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="313.9" font-size="11" fill="#18181b" text-anchor="middle">LAST-ACK</text>
<rect x="490" y="362" width="100" height="36" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="383.9" font-size="11" fill="#18181b" text-anchor="middle">CLOSED</text>
<text x="100" y="140" font-size="11" fill="#3f3f46" text-anchor="end">主动关闭</text>
<text x="600" y="260" font-size="11" fill="#3f3f46">被动关闭</text>
<path d="M210 150L490 200" fill="none" stroke="#d1493a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="350" y="160" font-size="11.5" fill="#d1493a" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">FIN = 1，seq = u</text>
<path d="M490 216L210 244" fill="none" stroke="#2f8f57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2f8f57)"/>
<text x="350" y="214" font-size="11" fill="#2f8f57" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ACK = 1，seq = v，ack = u + 1</text>
<path d="M480 270L220 280" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a3f3f46)"/>
<text x="350" y="268" font-size="11" fill="#3f3f46" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">数据传送（半关闭：B 还可以发）</text>
<path d="M490 300L210 320" fill="none" stroke="#d1493a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="350" y="297" font-size="11" fill="#d1493a" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">FIN = 1，ACK = 1，seq = w，ack = u + 1</text>
<path d="M210 340L490 374" fill="none" stroke="#2f8f57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2f8f57)"/>
<text x="350" y="335" font-size="11" fill="#2f8f57" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ACK = 1，seq = u + 1，ack = w + 1</text>
<path d="M104 330q-8 0 -8 8V357q0 8 -8 8q8 0 8 8V392q0 8 8 8" fill="none" stroke="#71717a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="368.9" font-size="11" fill="#71717a" text-anchor="end">等待 2MSL</text>
<text x="20" y="430" font-size="10.5" fill="#71717a">等 2MSL：可收到 B 重传的 FIN 并再次确认；让本连接的旧报文段全部消失</text>
<text x="600" y="200" font-size="11" fill="#3f3f46"><tspan x="600" dy="0">通知应用</tspan><tspan x="600" dy="14.3">进程</tspan></text>
</svg>
