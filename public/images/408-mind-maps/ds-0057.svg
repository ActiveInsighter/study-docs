<text x="380" y="210" font-size="13" fill="#18181b" font-weight="600">模式串 T = "abaabc"：</text>
<text x="380" y="234" font-size="12" fill="#3f3f46">第 6 个元素匹配失败：i 不变，令 j = 3</text>
<text x="380" y="252" font-size="12" fill="#3f3f46">第 5 个元素匹配失败：i 不变，令 j = 2</text>
<text x="380" y="270" font-size="12" fill="#3f3f46">第 4 个元素匹配失败：i 不变，令 j = 2</text>
<text x="380" y="288" font-size="12" fill="#3f3f46">第 3 个元素匹配失败：i 不变，令 j = 1</text>
<text x="380" y="306" font-size="12" fill="#3f3f46">第 2 个元素匹配失败：i 不变，令 j = 1</text>
<text x="380" y="324" font-size="12" fill="#2f8f57">第 1 个元素匹配失败：j = 0，然后 i++、j++</text>
<text x="84" y="290" font-size="12.5" fill="#71717a">next[j] = 失配时 j 应回退到的位置</text>
