<text x="75" y="92.2" font-size="15" fill="#18181b" text-anchor="middle">n</text>
<text x="145" y="92.2" font-size="15" fill="#18181b" text-anchor="middle">P<tspan baseline-shift="-22%" font-size="72%">0</tspan></text>
<text x="215" y="92.2" font-size="15" fill="#1e3a8a" text-anchor="middle">K<tspan baseline-shift="-22%" font-size="72%">1</tspan></text>
<text x="285" y="92.2" font-size="15" fill="#18181b" text-anchor="middle">P<tspan baseline-shift="-22%" font-size="72%">1</tspan></text>
<text x="355" y="92.2" font-size="15" fill="#1e3a8a" text-anchor="middle">K<tspan baseline-shift="-22%" font-size="72%">2</tspan></text>
<text x="425" y="92.2" font-size="15" fill="#18181b" text-anchor="middle">P<tspan baseline-shift="-22%" font-size="72%">2</tspan></text>
<text x="495" y="92.2" font-size="15" fill="#18181b" text-anchor="middle">…</text>
<text x="565" y="92.2" font-size="15" fill="#1e3a8a" text-anchor="middle">K<tspan baseline-shift="-22%" font-size="72%">n</tspan></text>
<text x="635" y="92.2" font-size="15" fill="#18181b" text-anchor="middle">P<tspan baseline-shift="-22%" font-size="72%">n</tspan></text>
<text x="40" y="134" font-size="13.5" fill="#3f3f46">K<tspan baseline-shift="-22%" font-size="72%">i</tspan>：关键字，满足 K<tspan baseline-shift="-22%" font-size="72%">1</tspan> &lt; K<tspan baseline-shift="-22%" font-size="72%">2</tspan> &lt; … &lt; K<tspan baseline-shift="-22%" font-size="72%">n</tspan>　　P<tspan baseline-shift="-22%" font-size="72%">i</tspan>：指向子树根结点的指针</text>
<text x="40" y="160" font-size="13.5" fill="#d1493a">P<tspan baseline-shift="-22%" font-size="72%">i−1</tspan> 所指子树的关键字均 &lt; K<tspan baseline-shift="-22%" font-size="72%">i</tspan>，P<tspan baseline-shift="-22%" font-size="72%">i</tspan> 所指子树的关键字均 &gt; K<tspan baseline-shift="-22%" font-size="72%">i</tspan></text>
<text x="40" y="186" font-size="13.5" fill="#3f3f46">n：结点中关键字个数，⌈m/2⌉ − 1 ≤ n ≤ m − 1</text>
