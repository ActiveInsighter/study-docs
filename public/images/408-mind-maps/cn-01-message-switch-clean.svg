<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="报文交换：整报文存储 — 转发" viewBox="0 0 840 275" width="840" height="275" font-family="Noto Sans CJK SC" xml:space="preserve"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#708399" stroke-width="1.25"/></marker></defs><rect width="840" height="275" fill="#ffffff" rx="18"/><rect x="1" y="1" width="838" height="273" rx="18" fill="none" stroke="#dbe4ee" stroke-width="2"/><text x="28" y="38" font-size="23" fill="#14283f" text-anchor="start" font-weight="700">报文交换：整报文存储 — 转发</text><text x="28" y="62" font-size="13" fill="#63748a" text-anchor="start">中间节点必须先获得完整报文，之后才能把该报文发送到下一跳</text><path d="M28 73 H812" stroke="#e3eaf2" stroke-width="1.4"/><rect x="37" y="106" width="142" height="86" rx="12" fill="#eaf3ff" stroke="#a7bdcf" stroke-width="1.7"/><text x="108" y="137" font-size="20" fill="#1e334f" text-anchor="middle" font-weight="700">A</text><text x="108" y="167" font-size="13" fill="#1e334f" text-anchor="middle">源主机</text><rect x="241" y="106" width="142" height="86" rx="12" fill="#fff4dc" stroke="#a7bdcf" stroke-width="1.7"/><text x="312" y="137" font-size="20" fill="#1e334f" text-anchor="middle" font-weight="700">B</text><text x="312" y="167" font-size="13" fill="#1e334f" text-anchor="middle">中继 / 缓冲</text><rect x="449" y="106" width="142" height="86" rx="12" fill="#fff4dc" stroke="#a7bdcf" stroke-width="1.7"/><text x="520" y="137" font-size="20" fill="#1e334f" text-anchor="middle" font-weight="700">C</text><text x="520" y="167" font-size="13" fill="#1e334f" text-anchor="middle">中继 / 缓冲</text><rect x="657" y="106" width="142" height="86" rx="12" fill="#eaf3ff" stroke="#a7bdcf" stroke-width="1.7"/><text x="728" y="137" font-size="20" fill="#1e334f" text-anchor="middle" font-weight="700">D</text><text x="728" y="167" font-size="13" fill="#1e334f" text-anchor="middle">目的主机</text><path d="M179 149 L241 149" fill="none" stroke="#5b7899" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M383 149 L449 149" fill="none" stroke="#5b7899" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M591 149 L657 149" fill="none" stroke="#5b7899" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)"/><text x="420" y="222" font-size="15" fill="#566a7f" text-anchor="middle">传输和存储需要时间；未收到完整报文前不能整报文转发</text></svg>