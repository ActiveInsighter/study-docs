<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="440" version="1.1" viewBox="0 0 1040 440" width="1040" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#fff" height="440" rx="16" ry="16" stroke="#d6e0e8" stroke-width="1.4" width="1040" x="0" y="0" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="bold" x="32" y="40">x86 CALL rel32：返回地址与目标地址分开算</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="normal" x="32" y="68">示例机器码：E8 D6 FF FF FF；起始地址0x00401025；有符号32位位移−42</text><rect fill="#eff6fb" height="95" rx="9" ry="9" stroke="#d6e0e8" stroke-width="1.2" width="294" x="35" y="110" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="182.0" y="152">0x00401025</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="182.0" y="182">CALL指令首地址</text><rect fill="#eff6fb" height="95" rx="9" ry="9" stroke="#d6e0e8" stroke-width="1.2" width="294" x="370" y="110" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="517.0" y="152">0x0040102A</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="517.0" y="182">返回地址 = 首址+5B</text><rect fill="#eff6fb" height="95" rx="9" ry="9" stroke="#d6e0e8" stroke-width="1.2" width="294" x="708" y="110" /><text fill="#172838" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="855.0" y="152">0x00401000</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="855.0" y="182">调用目标 = 返回地址−42</text><line stroke="#087e8b" stroke-width="2.6" x1="331" x2="366" y1="158" y2="158" /><polygon fill="#087e8b" points="366,158 358.5719794658129,163.08178226055531 358.5719794658129,152.91821773944469" /><text fill="#d97706" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="348" y="138">+5B</text><line stroke="#087e8b" stroke-width="2.6" x1="666" x2="704" y1="158" y2="158" /><polygon fill="#087e8b" points="704,158 696.5719794658129,163.08178226055531 696.5719794658129,152.91821773944469" /><text fill="#d97706" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="685" y="138">−42</text><rect fill="#f4faf4" height="95" rx="9" ry="9" stroke="#d6e0e8" stroke-width="1.2" width="405" x="70" y="280" /><text fill="#188267" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="bold" x="95" y="320">CALL：压入 0x0040102A</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="95" y="349">SP下降（典型x86 32位近调用为4B）</text><rect fill="#fff7eb" height="95" rx="9" ry="9" stroke="#d6e0e8" stroke-width="1.2" width="410" x="554" y="280" /><text fill="#d97706" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="bold" x="575" y="320">RET：弹出保存的返回地址</text><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="normal" x="575" y="349">EIP恢复为 0x0040102A</text><line stroke="#188267" stroke-width="2.6" x1="273" x2="273" y1="207" y2="273" /><polygon fill="#188267" points="273,273 267.9182177394447,265.5719794658129 278.0817822605553,265.5719794658129" /><line stroke="#d97706" stroke-width="2.6" x1="715" x2="521" y1="273" y2="207" /><polygon fill="#d97706" points="521,207 529.6689341138314,204.5814092264191 526.3954766331312,214.20339030605274" /><text fill="#536779" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14" font-weight="normal" x="45" y="419">位移编码D6 FF FF FF是32位补码FFFFFFD6的小端字节序；不是从CALL首地址直接加−42。</text></svg>