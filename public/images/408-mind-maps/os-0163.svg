<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="操作系统的发展历程">
<title>操作系统的发展历程</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="858.5" height="288.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">操作系统的发展历程</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="20" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="90" y="84.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="90" dy="0">独占计算机资源，</tspan><tspan x="90" dy="14.9">资源利用率低</tspan></text>
<text x="90" y="128" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">手工阶段</text>
<path d="M162 88L186 88" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="188" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="258" y="84.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="258" dy="0">减少 CPU 空闲时间，</tspan><tspan x="258" dy="14.9">提高 I/O 速度</tspan></text>
<text x="258" y="128" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">脱机处理</text>
<path d="M330 88L354 88" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="356" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="426" y="84.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="426" dy="0">高效利用 CPU</tspan><tspan x="426" dy="14.9">的资源</tspan></text>
<text x="426" y="128" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">单道批处理</text>
<path d="M498 88L522 88" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="524" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="594" y="84.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="594" dy="0">多道、宏观上并行、</tspan><tspan x="594" dy="14.9">微观上串行</tspan></text>
<text x="594" y="128" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">多道批处理</text>
<path d="M666 88L690 88" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="692" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="762" y="91.8" font-size="11" fill="#18181b" text-anchor="middle">交互性强</text>
<text x="762" y="128" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">分时操作系统</text>
<rect x="692" y="170" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="762" y="190.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="762" dy="0">及时性和可靠性强，</tspan><tspan x="762" dy="14.9">交互性不如分时</tspan></text>
<text x="762" y="234" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">实时操作系统</text>
<path d="M690 194L666 194" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="524" y="170" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="594" y="190.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="594" dy="0">服务于计算机网络，</tspan><tspan x="594" dy="14.9">集中控制方式</tspan></text>
<text x="594" y="234" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">网络操作系统</text>
<path d="M522 194L498 194" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="356" y="170" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="426" y="190.4" font-size="11" fill="#18181b" text-anchor="middle"><tspan x="426" dy="0">建立在网络上，</tspan><tspan x="426" dy="14.9">控制功能均分布</tspan></text>
<text x="426" y="234" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">分布式操作系统</text>
<path d="M354 194L330 194" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="188" y="170" width="140" height="48" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="258" y="197.8" font-size="11" fill="#18181b" text-anchor="middle">目前最广泛</text>
<text x="258" y="234" font-size="12" fill="#3b6fd4" text-anchor="middle" font-weight="600">个人计算机操作系统</text>
<path d="M830 88L839 88Q845 88 845 94L845 188.5Q845 194 839.5 194L834 194" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
</svg>
