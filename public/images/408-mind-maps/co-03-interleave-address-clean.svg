<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img" aria-label="co-03-interleave-address-clean.svg"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#446d9b" stroke-width="2" /></marker></defs><rect x="0" y="0" width="960" height="415" rx="20" fill="#fff" stroke="#d5e0ea" stroke-width="2" /><text x="30" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10283d">高位交叉 vs 低位交叉：同样的连续地址</text><line x1="30" y1="53" x2="930" y2="53" stroke="#d9e5ef" stroke-width="2"/><text x="31" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526579">四个存储体 M0~M3：低位交叉使连续地址 0/1/2/3 落在不同体</text><rect x="70" y="115" width="140" height="68" rx="9" fill="#e5effb" stroke="#9db4c7" stroke-width="2" /><text x="140" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18354d">M0</text><text x="140" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">存储体0</text><rect x="300" y="115" width="140" height="68" rx="9" fill="#e5effb" stroke="#9db4c7" stroke-width="2" /><text x="370" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18354d">M1</text><text x="370" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">存储体1</text><rect x="530" y="115" width="140" height="68" rx="9" fill="#e5effb" stroke="#9db4c7" stroke-width="2" /><text x="600" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18354d">M2</text><text x="600" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">存储体2</text><rect x="760" y="115" width="140" height="68" rx="9" fill="#e5effb" stroke="#9db4c7" stroke-width="2" /><text x="830" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18354d">M3</text><text x="830" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">存储体3</text><text x="42" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#18354d">高位交叉</text><text x="206" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526a83">0,1,2,3 → M0       其他一段连续地址 → M1/M2/M3</text><text x="42" y="294" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#18354d">低位交叉</text><text x="206" y="294" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#25684e">0 → M0    1 → M1    2 → M2    3 → M3    4 → M0</text><text x="42" y="361" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#4e6173">一般数学式：低位交叉体号 = 地址号 mod 4（地址号以单次传输单位计）</text></svg>