<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="计算机系统的多层次结构">
<title>计算机系统的多层次结构</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="758.5" height="490.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">计算机系统的层次结构</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="250" y="66" width="260" height="48" rx="8" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="380" y="94.9" font-size="14" fill="#18181b" text-anchor="middle">虚拟机器 M4（高级语言机器）</text>
<text x="530" y="94.5" font-size="13" fill="#3f3f46">用编译程序翻译成汇编语言程序</text>
<text x="230" y="94.5" font-size="13" fill="#3b6fd4" text-anchor="end" font-weight="600">编译</text>
<path d="M380 114L380 144" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="250" y="146" width="260" height="48" rx="8" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="380" y="174.9" font-size="14" fill="#18181b" text-anchor="middle">虚拟机器 M3（汇编语言机器）</text>
<text x="530" y="174.6" font-size="13" fill="#3f3f46">用汇编程序翻译成机器语言程序</text>
<text x="230" y="174.6" font-size="13" fill="#3b6fd4" text-anchor="end" font-weight="600">汇编</text>
<path d="M380 194L380 224" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="250" y="226" width="260" height="48" rx="8" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="380" y="254.9" font-size="14" fill="#18181b" text-anchor="middle">虚拟机器 M2（操作系统机器）</text>
<text x="530" y="254.6" font-size="13" fill="#3f3f46">用机器语言解释操作系统</text>
<text x="230" y="254.6" font-size="13" fill="#3b6fd4" text-anchor="end" font-weight="600">“广义指令”</text>
<path d="M380 274L380 320" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="250" y="322" width="260" height="48" rx="8" fill="#27272a" stroke="#27272a" stroke-width="1.5"/>
<text x="380" y="350.9" font-size="14" fill="#fafafa" text-anchor="middle" font-weight="600">传统机器 M1（用机器语言的机器）</text>
<text x="530" y="350.6" font-size="13" fill="#3f3f46">用微程序解释机器指令</text>
<text x="230" y="350.6" font-size="13" fill="#3b6fd4" text-anchor="end" font-weight="600">执行二进制</text>
<path d="M380 370L380 400" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="250" y="402" width="260" height="48" rx="8" fill="#27272a" stroke="#27272a" stroke-width="1.5"/>
<text x="380" y="430.9" font-size="14" fill="#fafafa" text-anchor="middle" font-weight="600">微程序机器 M0（微指令系统）</text>
<text x="530" y="430.6" font-size="13" fill="#3f3f46">由硬件直接执行微指令</text>
<text x="230" y="430.6" font-size="13" fill="#3b6fd4" text-anchor="end" font-weight="600">执行微指令</text>
<path d="M40 314L720 314" fill="none" stroke="#d1493a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="720" y="306" font-size="12" fill="#d1493a" text-anchor="end">软 / 硬件交界面</text>
<text x="380" y="478" font-size="12.5" fill="#71717a" text-anchor="middle">上层是下层的抽象，下层是上层的实现；M1、M0 为实际机器，M2 以上是虚拟机器</text>
</svg>
