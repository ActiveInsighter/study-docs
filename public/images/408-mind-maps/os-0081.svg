<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="请求分页的地址变换机构：快表 → 页表 → 缺页中断处理">
<title>请求分页的地址变换机构：快表 → 页表 → 缺页中断处理</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker><marker id="ad1493a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#d1493a"/></marker></defs>
<rect x="0.75" y="0.75" width="818.5" height="538.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">请求分页的地址变换流程</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="450" y="70" width="180" height="32" rx="6" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="90.4" font-size="12.5" fill="#18181b" text-anchor="middle">开始（请求访问一页）</text>
<path d="M540.0 112L640 134.0L540.0 156L440 134.0Z" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.3"/>
<text x="540" y="138.4" font-size="12.5" fill="#78350f" text-anchor="middle">页号 &gt; 页表长度？</text>
<path d="M540 102L540 111" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="450" y="166" width="180" height="32" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="186.4" font-size="12.5" fill="#18181b" text-anchor="middle">CPU 检索快表</text>
<path d="M540 156L540 165" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M540.0 208L640 230.0L540.0 252L440 230.0Z" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.3"/>
<text x="540" y="234.4" font-size="12.5" fill="#78350f" text-anchor="middle">页表项在快表中？</text>
<path d="M540 198L540 207" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="450" y="262" width="180" height="32" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="282.4" font-size="12.5" fill="#18181b" text-anchor="middle">访问页表（慢表）</text>
<path d="M540 252L540 261" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M540.0 304L640 326.0L540.0 348L440 326.0Z" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.3"/>
<text x="540" y="330.4" font-size="12.5" fill="#78350f" text-anchor="middle">页在内存？</text>
<path d="M540 294L540 303" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="450" y="358" width="180" height="32" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="378.4" font-size="12.5" fill="#18181b" text-anchor="middle">修改快表</text>
<path d="M540 348L540 357" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="450" y="406" width="180" height="32" rx="6" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="540" y="426.4" font-size="12.5" fill="#7f1d1d" text-anchor="middle">修改访问位和修改位</text>
<path d="M540 390L540 405" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="450" y="454" width="180" height="32" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="474.4" font-size="12.5" fill="#18181b" text-anchor="middle">形成物理地址</text>
<path d="M540 438L540 453" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="450" y="502" width="180" height="32" rx="6" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="522.4" font-size="12.5" fill="#18181b" text-anchor="middle">地址变换结束</text>
<path d="M540 486L540 501" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M640 134L700 134" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="702" y="120" width="90" height="28" rx="4" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="747" y="137.8" font-size="11" fill="#7f1d1d" text-anchor="middle">越界中断</text>
<text x="660" y="126" font-size="10.5" fill="#3f3f46" text-anchor="middle">是</text>
<path d="M640 230L714 230Q720 230 720 236L720 416Q720 422 714 422L632 422" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="660" y="222" font-size="10.5" fill="#3f3f46" text-anchor="middle">是</text>
<text x="724" y="250" font-size="10" fill="#7856c9"><tspan x="724" dy="0">快表中的页一定</tspan><tspan x="724" dy="13">在内存中</tspan></text>
<text x="736" y="428" font-size="10" fill="#2f8f57"><tspan x="736" dy="0">不一定都修改：</tspan><tspan x="736" dy="13">只有“写”才修改</tspan></text>
<rect x="40" y="90" width="330" height="420" rx="8" fill="none" stroke="#7856c9" stroke-width="1.6"/>
<rect x="100" y="108" width="210" height="24" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="205" y="124.4" font-size="12.5" fill="#18181b" text-anchor="middle">缺页中断处理</text>
<rect x="100" y="144" width="210" height="24" rx="6" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="205" y="160.4" font-size="12.5" fill="#7f1d1d" text-anchor="middle">保留 CPU 现场</text>
<path d="M205 132L205 143" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="100" y="180" width="210" height="24" rx="6" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="205" y="196.4" font-size="12.5" fill="#7f1d1d" text-anchor="middle">从外存中找到缺页</text>
<path d="M205 168L205 179" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M205.0 210L320 228.0L205.0 246L90 228.0Z" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.3"/>
<text x="205" y="232.4" font-size="12.5" fill="#78350f" text-anchor="middle">内存满否？</text>
<path d="M205 204L205 209" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="100" y="252" width="210" height="24" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="205" y="268.4" font-size="12.5" fill="#18181b" text-anchor="middle">选择一页换出</text>
<path d="M205 246L205 251" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M205.0 282L320 300.0L205.0 318L90 300.0Z" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.3"/>
<text x="205" y="304.4" font-size="12.5" fill="#78350f" text-anchor="middle">该页被修改否？</text>
<path d="M205 276L205 281" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="100" y="324" width="210" height="24" rx="6" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="205" y="340.4" font-size="12.5" fill="#7f1d1d" text-anchor="middle">将该页写回外存</text>
<path d="M205 318L205 323" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="100" y="360" width="210" height="24" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="205" y="376.4" font-size="12.5" fill="#18181b" text-anchor="middle">OS 命令 CPU 从外存读缺页</text>
<path d="M205 348L205 359" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="100" y="396" width="210" height="24" rx="6" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="205" y="412.4" font-size="12.5" fill="#7f1d1d" text-anchor="middle">启动 I/O 硬件</text>
<path d="M205 384L205 395" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="100" y="432" width="210" height="24" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="205" y="448.4" font-size="12.5" fill="#18181b" text-anchor="middle">将一页从外存换入内存</text>
<path d="M205 420L205 431" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="100" y="468" width="210" height="24" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="205" y="484.4" font-size="12.5" fill="#18181b" text-anchor="middle">修改页表</text>
<path d="M205 456L205 467" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M440 326L336 326Q330 326 330 320L330 126Q330 120 324 120L312 120" fill="none" stroke="#d1493a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="400" y="318" font-size="10.5" fill="#d1493a" text-anchor="middle">否：产生缺页中断</text>
<path d="M320 228L344 228Q350 228 350 234L350 366Q350 372 344 372L312 372" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="330" y="222" font-size="10" fill="#3f3f46" text-anchor="middle">否</text>
<path d="M90 300L66 300Q60 300 60 306L60 366Q60 372 66 372L98 372" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="66" y="294" font-size="10" fill="#3f3f46">否</text>
<path d="M205 492L205 514Q205 520 211 520L384 520Q390 520 390 514L390 188Q390 182 396 182L448 182" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="300" y="514" font-size="10.5" fill="#3f3f46" text-anchor="middle">返回，重新执行指令</text>
<text x="70" y="214" font-size="10.5" fill="#d1493a" text-anchor="middle"><tspan x="70" dy="0">页面置换</tspan><tspan x="70" dy="12.6">算法</tspan></text>
</svg>
