<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="455" version="1.1" viewBox="0 0 1220 455" width="1220" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>用户态与内核态：两条受控进入路径</title><defs><marker id="arw" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#475569" /></marker></defs><rect fill="#ffffff" height="453" rx="22" stroke="#dbe3ed" stroke-width="2" width="1218" x="1" y="1" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="bold" text-anchor="start" x="32" y="41">用户态与内核态：两条受控进入路径</text><text fill="#475569" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="32" y="68">每一条进入内核的路径都由硬件规定的入口机制建立受保护的执行状态</text><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="30" y="106">路径 A · 主动系统调用</text><rect fill="#eff6ff" height="90" rx="14" stroke="#2563eb" stroke-width="2" width="252" x="31" y="125" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="157.0" y="162.8">用户程序</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="157.0" y="189.8">准备参数</text><rect fill="#f5f3ff" height="90" rx="14" stroke="#7c3aed" stroke-width="2" width="252" x="332" y="125" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="458.0" y="162.8">系统调用指令</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="458.0" y="189.8">syscall / svc / ecall</text><rect fill="#ecfdf5" height="90" rx="14" stroke="#0f766e" stroke-width="2" width="252" x="633" y="125" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="759.0" y="162.8">内核服务</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="759.0" y="189.8">验证、执行、可阻塞</text><rect fill="#eff6ff" height="90" rx="14" stroke="#2563eb" stroke-width="2" width="252" x="934" y="125" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="1060.0" y="162.8">受控返回</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="1060.0" y="189.8">继续用户程序</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="288" x2="326" y1="170" y2="170" /><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="589" x2="627" y1="170" y2="170" /><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="890" x2="928" y1="170" y2="170" /><text fill="#b45309" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="31" y="269">路径 B · 外部设备中断</text><rect fill="#eff6ff" height="95" rx="14" stroke="#2563eb" stroke-width="2" width="252" x="31" y="286" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="157.0" y="326.3">用户/内核中的程序</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="157.0" y="353.3">正在执行</text><rect fill="#fff7ed" height="95" rx="14" stroke="#b45309" stroke-width="2" width="252" x="332" y="286" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="458.0" y="326.3">设备或时钟请求</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="458.0" y="353.3">硬件响应中断</text><rect fill="#ecfdf5" height="95" rx="14" stroke="#0f766e" stroke-width="2" width="252" x="633" y="286" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="759.0" y="326.3">中断服务 ISR</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="759.0" y="353.3">处理、唤醒、可调度</text><rect fill="#eff6ff" height="95" rx="14" stroke="#2563eb" stroke-width="2" width="252" x="934" y="286" /><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="1060.0" y="326.3">中断返回</text><text fill="#182438" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="1060.0" y="353.3">原进程或其他进程</text><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="288" x2="326" y1="333" y2="333" /><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="589" x2="627" y1="333" y2="333" /><line marker-end="url(#arw)" stroke="#475569" stroke-width="2.3" x1="890" x2="928" y1="333" y2="333" /><text fill="#475569" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="32" y="418">注意：进入内核态 ≠ 一定切换进程；外部中断被触发前，CPU可能在用户态也可能在内核态。</text></svg>