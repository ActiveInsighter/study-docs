<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 555" width="1140" height="555"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6d7e92"/></marker></defs><rect width="1140" height="555" fill="white"/><text x="570" y="45" text-anchor="middle" fill="#283447" font-size="26" font-weight="700" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享文件映射、私有写时复制：同一虚拟页号 ≠ 同一物理页</text><text x="570" y="76" text-anchor="middle" fill="#566d82" font-size="17" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种机制要分开：MAP_SHARED 的共享写入；MAP_PRIVATE / fork 的 COW</text><rect x="40" y="126" width="240" height="105" rx="9" fill="#eff5ff" stroke="#90a4c0" stroke-width="1.7"/><text x="160" y="162" text-anchor="middle" fill="#283447" font-size="19" font-weight="700" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">进程 A 地址空间</text><text x="160" y="195" text-anchor="middle" fill="#283447" font-size="18" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">V_A: 文件映射页</text><rect x="40" y="343" width="240" height="105" rx="9" fill="#eff5ff" stroke="#90a4c0" stroke-width="1.7"/><text x="160" y="379" text-anchor="middle" fill="#283447" font-size="19" font-weight="700" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">进程 B 地址空间</text><text x="160" y="412" text-anchor="middle" fill="#283447" font-size="18" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">V_B: 文件映射页</text><rect x="415" y="233" width="300" height="108" rx="9" fill="#e9f7ee" stroke="#75a694" stroke-width="1.7"/><text x="565" y="272" text-anchor="middle" fill="#283447" font-size="21" font-weight="700" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一物理页框 F</text><text x="565" y="309" text-anchor="middle" fill="#283447" font-size="18" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">只读或共享可写映射</text><polyline points="280,174 340,174 340,258 415,258" fill="none" stroke="#6d7e92" stroke-width="2" marker-end="url(#arrow)"/><polyline points="280,391 340,391 340,317 415,317" fill="none" stroke="#6d7e92" stroke-width="2" marker-end="url(#arrow)"/><rect x="847" y="130" width="250" height="104" rx="9" fill="#fff3e4" stroke="#bd9f76" stroke-width="1.7"/><text x="972" y="164" text-anchor="middle" fill="#283447" font-size="19" font-weight="700" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">COW：共享只读页</text><text x="972" y="198" text-anchor="middle" fill="#283447" font-size="17" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">写入触发新私有页</text><rect x="847" y="320" width="250" height="104" rx="9" fill="#fff3e4" stroke="#bd9f76" stroke-width="1.7"/><text x="972" y="355" text-anchor="middle" fill="#283447" font-size="17" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">原页仍可被其他进程读</text><text x="972" y="387" text-anchor="middle" fill="#283447" font-size="17" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">写进程改映射到新页</text><polyline points="715,282 782,282 782,181 847,181" fill="none" stroke="#6d7e92" stroke-width="2" marker-end="url(#arrow)"/><path d="M972 234 L972 320" stroke="#6d7e92" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="570" y="526" text-anchor="middle" fill="#677184" font-size="17" font-weight="500" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享页表项与映射权限因系统实现而异；共享写与 COW 不要混为一谈</text></svg>