<text x="240" y="236.2" font-size="12" fill="#71717a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">4</text>
<rect x="270" y="216" width="80" height="32" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="60" y="268.6" font-size="13" fill="#d1493a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="160" y="268.4" font-size="12.5" fill="#3b6fd4" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">−</text>
<text x="240" y="268.2" font-size="12" fill="#71717a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">5</text>
<rect x="270" y="248" width="80" height="32" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="60" y="300.6" font-size="13" fill="#d1493a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="160" y="300.4" font-size="12.5" fill="#3b6fd4" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">−</text>
