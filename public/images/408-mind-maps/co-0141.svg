<rect x="270" y="312" width="80" height="32" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<path d="M354 90q8 0 8 8V112q0 8 8 8q-8 0 -8 8V142q0 8 -8 8" fill="none" stroke="#c98a12" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="376" y="124.5" font-size="13" fill="#c98a12">第 0 组</text>
<path d="M354 154q8 0 8 8V176q0 8 8 8q-8 0 -8 8V206q0 8 -8 8" fill="none" stroke="#c98a12" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="376" y="188.6" font-size="13" fill="#c98a12">第 1 组</text>
<path d="M354 218q8 0 8 8V240q0 8 8 8q-8 0 -8 8V270q0 8 -8 8" fill="none" stroke="#c98a12" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="376" y="252.6" font-size="13" fill="#c98a12">第 2 组</text>
<path d="M354 282q8 0 8 8V304q0 8 8 8q-8 0 -8 8V334q0 8 -8 8" fill="none" stroke="#c98a12" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="376" y="316.6" font-size="13" fill="#c98a12">第 3 组</text>
<text x="310" y="360" font-size="12.5" fill="#3f3f46" text-anchor="middle">Cache：8 × 64B = 512 B</text>
<text x="450" y="92" font-size="13" fill="#18181b" font-weight="700">CPU 访问主存地址</text>
<text x="450" y="118" font-size="13" fill="#3b6fd4" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">1…111<tspan fill="#c98a12" font-weight="600">01</tspan>001110</text>
<text x="450" y="150" font-size="12.5" fill="#3f3f46">① 根据主存块号的后 2 位确定 Cache 组号</text>
<text x="450" y="174" font-size="12.5" fill="#3f3f46">② 遍历该组中的所有行：前 20 位与</text>
<text x="450" y="198" font-size="12.5" fill="#3f3f46">　 某行标记匹配且有效位 = 1，则命中，</text>
<text x="450" y="222" font-size="12.5" fill="#3f3f46">　 访问块内地址为 001110 的单元</text>
<text x="450" y="246" font-size="12.5" fill="#3f3f46">③ 若未命中或有效位 = 0，则正常访问主存</text>
</svg>
