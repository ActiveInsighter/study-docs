<text x="60" y="332.6" font-size="13" fill="#d1493a" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="160" y="332.4" font-size="12.5" fill="#3b6fd4" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">−</text>
