<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="510" version="1.1" viewBox="0 0 1080 510" width="1080" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="510" rx="12" stroke="#cdd9e8" stroke-width="1.6" width="1080" x="0" y="0" /><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="30" y="44">TCP 三次握手：每个 SYN 都占用一个序号</text><text fill="#48647b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="30" y="78">初始序号分别为 x、y；纯ACK不消耗序号。时间自上而下。</text><line stroke="#cdd9e8" stroke-width="1.5" x1="30" x2="1050" y1="94" y2="94" /><rect fill="#e9f1ff" height="54" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="340" x="56" y="112" /><rect fill="#e7f8ef" height="54" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="340" x="687" y="112" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="225" y="148">客户端 A</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="858" y="148">服务端 B</text><line stroke="#48647b" stroke-dasharray="7 7" stroke-width="2" x1="221" x2="221" y1="180" y2="462" /><line stroke="#48647b" stroke-dasharray="7 7" stroke-width="2" x1="858" x2="858" y1="180" y2="462" /><line stroke="#275dad" stroke-width="3" x1="221" x2="858" y1="216" y2="264" /><polygon fill="#275dad" points="858,264 846.7473619485274,268.1687092585777 847.4991320110449,258.1920940539176" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="499" y="220">① SYN=1, seq=x</text><line stroke="#15766d" stroke-width="3" x1="858" x2="221" y1="300" y2="348" /><polygon fill="#15766d" points="221,348 231.500867988955,342.1920940539176 232.2526380514726,352.1687092585777" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="534" y="310">② SYN=1, ACK=1, seq=y, ack=x+1</text><line stroke="#275dad" stroke-width="3" x1="221" x2="858" y1="385" y2="430" /><polygon fill="#275dad" points="858,430 846.7670141034315,434.22137748223173 847.4720395916374,424.24135001585006" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="544" y="388">③ ACK=1, seq=x+1, ack=y+1</text><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="236" y="196">CLOSED → SYN-SENT</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="end" x="842" y="196">LISTEN → SYN-RCVD</text><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="242" y="450">A发③后进入ESTABLISHED</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="end" x="1030" y="469">B收③后进入ESTABLISHED</text></svg>