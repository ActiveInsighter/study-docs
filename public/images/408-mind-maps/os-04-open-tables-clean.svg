<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="640" viewBox="0 0 1130 640" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52637a"/></marker><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif} .muted{fill:#52637a}.mono{font-family:monospace}</style></defs>
<rect x="1" y="1" width="1128" height="638" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
<text x="34" y="55" font-size="30" fill="#1b283b" font-weight="700" text-anchor="start">文件描述符 → 打开文件描述 → inode：不要混用计数</text>
<text x="34" y="90" font-size="20" fill="#52637a" font-weight="400" text-anchor="start">示例：进程 P 两个 fd 使用 dup 共享偏移；另一次 open 独立偏移</text>
<rect x="42" y="136" width="278" height="385" rx="12" fill="#e8f1ff" stroke="#80abe5" stroke-width="2"/>
<text x="68" y="178" font-size="26" fill="#1b283b" font-weight="700" text-anchor="start">进程 P 的 fd 表</text>
<rect x="62" y="216" width="238" height="60" rx="7" fill="#fff" stroke="#b0c6de" stroke-width="2"/>
<text x="82" y="254" font-size="24" fill="#1b283b" font-weight="700" text-anchor="start">fd=3</text>
<text x="178" y="254" font-size="17" fill="#1b283b" font-weight="400" text-anchor="start">dup前原描述符</text>
<rect x="62" y="298" width="238" height="60" rx="7" fill="#fff" stroke="#b0c6de" stroke-width="2"/>
<text x="82" y="336" font-size="24" fill="#1b283b" font-weight="700" text-anchor="start">fd=4</text>
<text x="178" y="336" font-size="17" fill="#1b283b" font-weight="400" text-anchor="start">dup后新描述符</text>
<rect x="62" y="380" width="238" height="60" rx="7" fill="#fff" stroke="#b0c6de" stroke-width="2"/>
<text x="82" y="418" font-size="24" fill="#1b283b" font-weight="700" text-anchor="start">fd=5</text>
<text x="178" y="418" font-size="17" fill="#1b283b" font-weight="400" text-anchor="start">再一次独立open</text>
<rect x="444" y="152" width="276" height="172" rx="12" fill="#eaf9f4" stroke="#77bfaa" stroke-width="2"/>
<text x="468" y="190" font-size="24" fill="#1b283b" font-weight="700" text-anchor="start">打开文件描述 X</text>
<text x="468" y="226" font-size="22" fill="#1b283b" font-weight="400" text-anchor="start">当前偏移 = 5</text>
<text x="468" y="264" font-size="21" fill="#1b283b" font-weight="400" text-anchor="start">引用计数 = 2</text>
<text x="468" y="299" font-size="18" fill="#1b283b" font-weight="400" text-anchor="start">读写模式、inode引用</text>
<rect x="444" y="364" width="276" height="157" rx="12" fill="#f3f0ff" stroke="#ad99ed" stroke-width="2"/>
<text x="468" y="401" font-size="24" fill="#1b283b" font-weight="700" text-anchor="start">打开文件描述 Y</text>
<text x="468" y="438" font-size="22" fill="#1b283b" font-weight="400" text-anchor="start">独立偏移 = 0</text>
<text x="468" y="477" font-size="21" fill="#1b283b" font-weight="400" text-anchor="start">引用计数 = 1</text>
<rect x="848" y="226" width="238" height="220" rx="12" fill="#fff5e6" stroke="#d99b4d" stroke-width="2"/>
<text x="876" y="268" font-size="27" fill="#1b283b" font-weight="700" text-anchor="start">同一个 inode A</text>
<text x="876" y="313" font-size="21" fill="#1b283b" font-weight="400" text-anchor="start">文件大小、权限</text>
<text x="876" y="353" font-size="21" fill="#1b283b" font-weight="400" text-anchor="start">硬链接数、数据块</text>
<text x="876" y="396" font-size="19" fill="#1b283b" font-weight="400" text-anchor="start">（元数据对象）</text>
<path d="M300 246 H363 V210 H435" fill="none" stroke="#52637a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 328 H389 V230 H435" fill="none" stroke="#52637a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 410 H368 V440 H435" fill="none" stroke="#52637a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M720 236 H786 V298 H838" fill="none" stroke="#52637a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M720 429 H786 V383 H838" fill="none" stroke="#52637a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="34" y="574" font-size="22" fill="#1b283b" font-weight="700" text-anchor="start">关键：fd编号属于进程；偏移属于“打开文件描述”；硬链接数属于文件的inode。</text>
<text x="34" y="604" font-size="18" fill="#52637a" font-weight="400" text-anchor="start">注：实际内核实现细节可能因系统而异，本图是经典类 UNIX 的抽象示例。</text>
</svg>