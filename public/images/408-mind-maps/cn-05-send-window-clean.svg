="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="602" y="301">发送窗口8 MSS</text><line stroke="#15766d" stroke-width="3" x1="695" x2="974" y1="322" y2="322" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="834.5" y="350">剩余可发3 MSS</text><rect fill="#f2f7ff" height="44" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="998" x="40" y="376" /><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="53" y="402">若窗口8 MSS、已有5 MSS在途 ⇒ 本轮仍可新增3 MSS（不考虑发送缓冲和应用数据缺口）</text></svg>