<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" width="460" height="400" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="分层的操作系统：层 0 为硬件，层 N 为用户接口，每层只能调用相邻低层">
<title>分层的操作系统：层 0 为硬件，层 N 为用户接口，每层只能调用相邻低层</title>
<rect x="0.75" y="0.75" width="458.5" height="398.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">分层的操作系统</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<circle cx="230" cy="220" r="150" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<circle cx="230" cy="220" r="112" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<circle cx="230" cy="220" r="74" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<circle cx="230" cy="220" r="36" fill="#efe9fb" stroke="#7856c9" stroke-width="1.5"/>
<text x="230" y="100" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="600">层 N　用户接口</text>
<text x="230" y="132" font-size="13" fill="#71717a" text-anchor="middle">⋯</text>
<text x="230" y="168" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="600">层 1</text>
<text x="230" y="215.9" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="600"><tspan x="230" dy="0">层 0</tspan><tspan x="230" dy="16.9">硬件</tspan></text>
<text x="230" y="390" font-size="11.5" fill="#71717a" text-anchor="middle">每层只能调用紧邻它的低层的功能和服务（单向依赖）</text>
</svg>
