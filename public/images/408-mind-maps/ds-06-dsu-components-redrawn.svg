<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="315" version="1.1" viewBox="0 0 900 315" width="900" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-dark" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M1,1 L9,5 L1,9 Z" fill="#192338" /></marker><marker id="arrow-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M1,1 L9,5 L1,9 Z" fill="#dc3545" /></marker></defs><rect fill="white" height="313" rx="16" stroke="#dce4ef" stroke-width="2" width="898" x="1" y="1" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" x="28" y="40">并查集：求无向图的连通分量</text><rect fill="#2563eb" height="3" rx="2" width="32" x="28" y="51" /><text fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="13" x="28" y="76">遍历每条边，把两个端点所在的集合合并；不同根的数量 = 连通分量数</text><rect fill="#f7f9fc" height="208" rx="11" stroke="#dce4ef" stroke-width="1.2" width="420" x="23" y="83" /><rect fill="#f7f9fc" height="208" rx="11" stroke="#dce4ef" stroke-width="1.2" width="421" x="455" y="83" /><line stroke="#192338" stroke-width="2" x1="95" x2="185" y1="157" y2="120" /><line stroke="#192338" stroke-width="2" x1="95" x2="185" y1="157" y2="213" /><line stroke="#192338" stroke-width="2" x1="185" x2="185" y1="120" y2="213" /><line stroke="#192338" stroke-width="2" x1="307" x2="376" y1="160" y2="160" /><circle cx="95" cy="157" fill="#ffffff" r="22" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="95" y="162">A</text><circle cx="185" cy="120" fill="#ffffff" r="22" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="185" y="125">B</text><circle cx="185" cy="213" fill="#ffffff" r="22" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="185" y="218">C</text><circle cx="307" cy="160" fill="#ffffff" r="22" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="307" y="165">D</text><circle cx="376" cy="160" fill="#ffffff" r="22" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="376" y="165">E</text><text fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="13" x="45" y="271">左：5 个顶点、4 条边、两个分量</text><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" x="480" y="127">每处理一条无向边执行 Union(u,v)</text><rect fill="#dbeafe" height="36" rx="9" width="194" x="485" y="161" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" x="497" y="185">集合 1：{A,B,C}</text><rect fill="#dcfce7" height="36" rx="9" width="194" x="485" y="211" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" x="497" y="235">集合 2：{D,E}</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="13" x="705" y="174">Find(A)=Find(C)</text><text fill="#16866b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="13" x="705" y="224">Find(D)≠Find(A)</text></svg>