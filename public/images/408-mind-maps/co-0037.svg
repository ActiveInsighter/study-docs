<text x="162" y="196" font-size="11.5" fill="#d1493a" text-anchor="end">A₁₄</text>
<text x="162" y="218" font-size="11.5" fill="#d1493a" text-anchor="end">A₁₃</text>
<text x="162" y="240" font-size="11.5" fill="#d1493a" text-anchor="end">A₁₂~A₀</text>
