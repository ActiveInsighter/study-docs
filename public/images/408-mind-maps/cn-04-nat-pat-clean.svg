<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520" version="1.1" viewBox="0 0 1100 520" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="520" rx="14" stroke="#d3dfeb" stroke-width="1.5" width="1100" x="0" y="0" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="30" y="45">NAPT/PAT｜两个内网端点复用同一公网 IPv4</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" text-anchor="start" x="30" y="73">示例地址采用 RFC 文档保留网段（203.0.113.0/24、198.51.100.0/24），仅用于演示。</text><line stroke="#d3dfeb" stroke-width="2" x1="30" x2="1070" y1="88" y2="88" /><rect fill="#ebf7ff" height="150" rx="8" stroke="#7bb4dd" stroke-width="1.2" width="260" x="35" y="114" /><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="54" y="151">内网主机 A</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start" x="54" y="186">192.168.1.10 : 50000</text><text fill="#2463eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="54" y="227">内网主机 B</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="start" x="54" y="252">192.168.1.11 : 50000</text><rect fill="#f1fbf7" height="118" rx="8" stroke="#67bda2" stroke-width="1.2" width="255" x="405" y="135" /><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="532" y="173">NAT/PAT 路由器</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="532" y="209">公网 IP：203.0.113.5</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="532" y="238">转换并记录映射状态</text><rect fill="#fff7ed" height="95" rx="8" stroke="#e3b97b" stroke-width="1.2" width="300" x="766" y="149" /><text fill="#a85f00" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="915" y="184">外部服务器</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="915" y="217">198.51.100.20 : 443</text><line stroke="#2463eb" stroke-width="2.5" x1="295" x2="405" y1="164" y2="164" /><polygon fill="#2463eb" points="405.0,164.0 395.3465918192059,158.72631907535376 395.3465918192059,169.27368092464624" /><line stroke="#087f8c" stroke-width="2.5" x1="295" x2="405" y1="230" y2="210" /><polygon fill="#087f8c" points="405.0,210.0 394.55891743787214,206.53823817531736 396.44568688413665,216.91547012977193" /><line stroke="#a85f00" stroke-width="3" x1="660" x2="766" y1="196" y2="196" /><polygon fill="#a85f00" points="766.0,196.0 756.3465918192059,190.72631907535376 756.3465918192059,201.27368092464624" /><rect fill="#f7faff" height="179" rx="8" stroke="#d3dfeb" stroke-width="1.2" width="1031" x="35" y="290" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="start" x="53" y="321">出站映射表（TCP 示例）</text><rect fill="#dfeafa" height="35" rx="0" stroke="#adbfdf" stroke-width="1.2" width="994" x="52" y="336" /><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="start" x="70" y="361">内网源 IP:Port</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="start" x="398" y="361">公网源 IP:Port</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="start" x="710" y="361">目的 IP:Port</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="68" y="387">192.168.1.10:50000</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="start" x="398" y="387">203.0.113.5:40001</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="711" y="387">198.51.100.20:443</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="68" y="426">192.168.1.11:50000</text><text fill="#16836d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="start" x="398" y="426">203.0.113.5:40002</text><text fill="#183149" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="start" x="711" y="426">198.51.100.20:443</text><text fill="#527084" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="36" y="494">回包目的公网IP:Port → 根据映射还原内网目的IP:Port；普通转发不等于修改 IP 地址。</text></svg>