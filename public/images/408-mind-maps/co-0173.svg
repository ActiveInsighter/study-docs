<text x="340" y="183.5" font-size="11.5" fill="#7f1d1d" text-anchor="middle"><tspan x="340" dy="0">辅助位初始为 0；每次右移</tspan><tspan x="340" dy="15.5">会把 MQ 的最低位顶替</tspan><tspan x="340" dy="15.5">原来的辅助位（MQ 共 n+2 位）</tspan></text>
<text x="490" y="84" font-size="14" fill="#18181b" font-weight="700">补码一位乘法</text>
<text x="490" y="112" font-size="12.5" fill="#3f3f46">· 进行 n 轮加法、移位，最后多一次加法</text>
<text x="490" y="136" font-size="12.5" fill="#3f3f46">· 每次加 0、+[x]<tspan baseline-shift="-22%" font-size="72%">补</tspan> 或 +[−x]<tspan baseline-shift="-22%" font-size="72%">补</tspan></text>
<text x="490" y="160" font-size="12.5" fill="#3f3f46">· 每次移位是补码的算术右移</text>
<text x="490" y="184" font-size="12.5" fill="#3f3f46">· 符号位参与运算（双符号位）</text>
<text x="490" y="220" font-size="12.5" fill="#d1493a">辅助位 − 最低位 = 1：ACC + [x]<tspan baseline-shift="-22%" font-size="72%">补</tspan></text>
<text x="490" y="244" font-size="12.5" fill="#d1493a">辅助位 − 最低位 = 0：ACC + 0</text>
<text x="490" y="268" font-size="12.5" fill="#d1493a">辅助位 − 最低位 = −1：ACC + [−x]<tspan baseline-shift="-22%" font-size="72%">补</tspan></text>
</svg>
