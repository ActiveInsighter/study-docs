<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 445" width="1200" height="445" role="img" aria-label="DNS：主机递归请求 + 解析器迭代查找（示意）" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>DNS：主机递归请求 + 解析器迭代查找（示意）</title><rect width="1200" height="445" rx="18" fill="#ffffff"/><rect x="1" y="1" width="1198" height="443" rx="18" fill="none" stroke="#d9e3ec" stroke-width="2"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9z" fill="#3b5c82"/></marker></defs><text x="40" y="50" font-size="26" fill="#182e46" font-weight="700">DNS：主机递归请求 + 解析器迭代查找（示意）</text><line x1="40" y1="67" x2="1160" y2="67" stroke="#e1e8f0" stroke-width="2"/><rect x="55" y="104" width="215" height="78" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="162.5" y="134" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">主机/Stub</text><text x="162.5" y="164" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">发起递归请求</text><rect x="340" y="104" width="228" height="78" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="454.0" y="134" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">本地递归解析器</text><text x="454.0" y="164" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">检查缓存，代查</text><rect x="650" y="104" width="215" height="78" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="757.5" y="134" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">根服务器</text><text x="757.5" y="164" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">返回 .com 的 NS</text><rect x="935" y="104" width="215" height="78" rx="12" fill="#eff5fc" stroke="#8daac9" stroke-width="2"/><text x="1042.5" y="134" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">TLD .com</text><text x="1042.5" y="164" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">返回 abc.com 的 NS</text><rect x="775" y="275" width="280" height="78" rx="12" fill="#e5f7f0" stroke="#64b99c" stroke-width="2"/><text x="915.0" y="305" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">abc.com 权威服务器</text><text x="915.0" y="335" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">回答 A/AAAA 等记录</text><line x1="271" y1="143" x2="334" y2="143" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="302.5" y="124" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">递归</text><line x1="573" y1="143" x2="641" y2="143" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="607.0" y="124" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">迭代</text><line x1="867" y1="143" x2="926" y2="143" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="896.5" y="124" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">迭代</text><line x1="1039" y1="183" x2="990" y2="268" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1014.5" y="213" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">迭代</text><line x1="768" y1="315" x2="513" y2="186" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="640.5" y="252" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">最终结果</text><line x1="452" y1="192" x2="211" y2="192" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="331.5" y="216" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">解析结果</text><text x="600" y="387" fill="#60748a" font-size="17" font-weight="400" text-anchor="middle">说明：缓存命中可直接返回；实际委派链可能存在多级权威服务器和 CNAME 跳转。</text><text x="600" y="414" fill="#60748a" font-size="17" font-weight="400" text-anchor="middle">根服务器提供委派信息；根服务器不是每个域名的最终 IP 提供者。</text></svg>