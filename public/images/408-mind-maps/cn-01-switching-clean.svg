<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三种交换方式的时间线对比" viewBox="0 0 1020 535" width="1020" height="535" font-family="Noto Sans CJK SC" xml:space="preserve"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#708399" stroke-width="1.25"/></marker></defs><rect width="1020" height="535" fill="#ffffff" rx="18"/><rect x="1" y="1" width="1018" height="533" rx="18" fill="none" stroke="#dbe4ee" stroke-width="2"/><text x="28" y="38" font-size="23" fill="#14283f" text-anchor="start" font-weight="700">三种交换方式的时间线对比</text><text x="28" y="62" font-size="13" fill="#63748a" text-anchor="start">时间从左向右；三条链路 A→B、B→C、C→D；P1、P2、P3 表示等长分组</text><path d="M28 73 H992" stroke="#e3eaf2" stroke-width="1.4"/><rect x="20" y="94" width="302" height="406" rx="12" fill="#fcfdff" stroke="#d1dce8" stroke-width="1.7"/><text x="171.0" y="126" font-size="18" fill="#1e334f" text-anchor="middle" font-weight="700">电路交换</text><rect x="348" y="94" width="302" height="406" rx="12" fill="#fcfdff" stroke="#d1dce8" stroke-width="1.7"/><text x="499.0" y="126" font-size="18" fill="#1e334f" text-anchor="middle" font-weight="700">报文交换</text><rect x="676" y="94" width="324" height="406" rx="12" fill="#fcfdff" stroke="#d1dce8" stroke-width="1.7"/><text x="838.0" y="126" font-size="18" fill="#1e334f" text-anchor="middle" font-weight="700">分组交换</text><text x="176.0" y="162" font-size="13" fill="#5b6d83" text-anchor="middle">建连 → 传输 → 释放</text><rect x="54" y="175" width="244" height="64" rx="8" fill="#e8f1ff" stroke="#a8bdd2" stroke-width="1.7"/><text x="176.0" y="215" font-size="18" fill="#1e334f" text-anchor="middle" font-weight="700">建连</text><rect x="54" y="264" width="244" height="64" rx="8" fill="#def7eb" stroke="#a8bdd2" stroke-width="1.7"/><text x="176.0" y="304" font-size="18" fill="#1e334f" text-anchor="middle" font-weight="700">持续发送</text><rect x="54" y="362" width="244" height="64" rx="8" fill="#fdf0e4" stroke="#a8bdd2" stroke-width="1.7"/><text x="176.0" y="402" font-size="18" fill="#1e334f" text-anchor="middle" font-weight="700">释放</text><text x="176.0" y="467" font-size="12" fill="#61758a" text-anchor="middle">建立期间数据尚不能传输</text><text x="382" y="162" font-size="13" fill="#536982" text-anchor="start">同一份报文 M 逐跳串行转发</text><rect x="386" y="195" width="236" height="56" rx="7" fill="#eaf3ff" stroke="#9fb7cc" stroke-width="1.7"/><text x="405" y="230" font-size="16" fill="#263c56" text-anchor="start">A→B：发送 M</text><rect x="386" y="278" width="236" height="56" rx="7" fill="#fcf0da" stroke="#9fb7cc" stroke-width="1.7"/><text x="405" y="313" font-size="16" fill="#263c56" text-anchor="start">B→C：发送 M</text><rect x="386" y="361" width="236" height="56" rx="7" fill="#e2f8ea" stroke="#9fb7cc" stroke-width="1.7"/><text x="405" y="396" font-size="16" fill="#263c56" text-anchor="start">C→D：发送 M</text><text x="504.0" y="467" font-size="12" fill="#61758a" text-anchor="middle">下一跳需等待整份 M 到齐</text><text x="710" y="163" font-size="12" fill="#536982" text-anchor="start">一条带宽等速链路占1个时间槽</text><text x="710" y="205" font-size="14" fill="#273d59" text-anchor="start" font-weight="700">A→B</text><rect x="788" y="186" width="38" height="45" rx="6" fill="#d7ebff" stroke="#9cb4ca" stroke-width="1.7"/><text x="807.0" y="215" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P1</text><rect x="830" y="186" width="38" height="45" rx="6" fill="#d8f8e6" stroke="#9cb4ca" stroke-width="1.7"/><text x="849.0" y="215" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P2</text><rect x="872" y="186" width="38" height="45" rx="6" fill="#fff0cf" stroke="#9cb4ca" stroke-width="1.7"/><text x="891.0" y="215" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P3</text><text x="710" y="289" font-size="14" fill="#273d59" text-anchor="start" font-weight="700">B→C</text><rect x="830" y="270" width="38" height="45" rx="6" fill="#d7ebff" stroke="#9cb4ca" stroke-width="1.7"/><text x="849.0" y="299" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P1</text><rect x="872" y="270" width="38" height="45" rx="6" fill="#d8f8e6" stroke="#9cb4ca" stroke-width="1.7"/><text x="891.0" y="299" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P2</text><rect x="914" y="270" width="38" height="45" rx="6" fill="#fff0cf" stroke="#9cb4ca" stroke-width="1.7"/><text x="933.0" y="299" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P3</text><text x="710" y="373" font-size="14" fill="#273d59" text-anchor="start" font-weight="700">C→D</text><rect x="872" y="354" width="38" height="45" rx="6" fill="#d7ebff" stroke="#9cb4ca" stroke-width="1.7"/><text x="891.0" y="383" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P1</text><rect x="914" y="354" width="38" height="45" rx="6" fill="#d8f8e6" stroke="#9cb4ca" stroke-width="1.7"/><text x="933.0" y="383" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P2</text><rect x="956" y="354" width="38" height="45" rx="6" fill="#fff0cf" stroke="#9cb4ca" stroke-width="1.7"/><text x="975.0" y="383" font-size="13" fill="#1e334f" text-anchor="middle" font-weight="700">P3</text><text x="843.0" y="467" font-size="12" fill="#61758a" text-anchor="middle">不同分组沿不同链路可并行</text><text x="510" y="521" font-size="13" fill="#597086" text-anchor="middle">此图未计传播、处理、排队与首部开销；真实网络中还会发生链路争用</text></svg>