<text x="35" y="548" font-size="21" fill="#1b283b" font-weight="700" text-anchor="start">分配：当前组弹出号 → 触及组入口时装载下一组的块号表</text>
<text x="35" y="587" font-size="21" fill="#1b283b" font-weight="700" text-anchor="start">回收：栈未满直接入栈；栈满时将原组表写入回收块并建立新的组入口</text>
