<text x="34" y="53" font-size="30" fill="#1b283b" font-weight="700" text-anchor="start">成组链接：块号数组（栈）+ 组间链</text>
<text x="34" y="90" font-size="20" fill="#52637a" font-weight="400" text-anchor="start">以下只表示组间关系，具体栈顶和哨兵位置按题目给定约定执行</text>
