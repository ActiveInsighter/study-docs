<text x="60" y="316.9" font-size="14" fill="#18181b" text-anchor="middle" font-weight="500">0</text>
<text x="470" y="96" font-size="14" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">u = (n<tspan baseline-shift="-22%" font-size="72%">0</tspan> − 1) % (k − 1)</text>
<text x="470" y="122" font-size="14" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  = (9 − 1) % 3 = 2 ≠ 0</text>
<text x="470" y="160" font-size="14" fill="#18181b" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">补 (k − 1) − u = 3 − 2 = <tspan font-weight="700">1</tspan> 个虚段</text>
<text x="470" y="206" font-size="13" fill="#d1493a">✗ 不是 (9 + 3) % 4，补 3 个</text>
<text x="470" y="232" font-size="13" fill="#71717a">u = 0 时无需补充</text>
<text x="390" y="362" font-size="12.5" fill="#71717a" text-anchor="middle">权值 1…9 的 9 个归并段 + 1 个虚段 → 严格 4 叉树</text>
