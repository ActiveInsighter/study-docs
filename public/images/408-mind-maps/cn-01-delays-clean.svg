<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="发送时延与传播时延不是一回事" viewBox="0 0 900 352" width="900" height="352" font-family="Noto Sans CJK SC" xml:space="preserve"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#708399" stroke-width="1.25"/></marker></defs><rect width="900" height="352" fill="#ffffff" rx="18"/><rect x="1" y="1" width="898" height="350" rx="18" fill="none" stroke="#dbe4ee" stroke-width="2"/><text x="28" y="38" font-size="23" fill="#14283f" text-anchor="start" font-weight="700">发送时延与传播时延不是一回事</text><text x="28" y="62" font-size="13" fill="#63748a" text-anchor="start">一个描述把比特推入线路所需时间，另一个描述信号穿过介质所需时间</text><path d="M28 73 H872" stroke="#e3eaf2" stroke-width="1.4"/><rect x="32" y="99" width="399" height="155" rx="12" fill="#eaf3ff" stroke="#acc4d7" stroke-width="1.7"/><text x="55" y="134" font-size="20" fill="#1e334f" text-anchor="start" font-weight="700">发送时延</text><text x="228" y="193" font-size="32" fill="#123e69" text-anchor="middle" font-weight="700">L / R</text><rect x="467" y="99" width="399" height="155" rx="12" fill="#e5f8ee" stroke="#acc4d7" stroke-width="1.7"/><text x="490" y="134" font-size="20" fill="#1e334f" text-anchor="start" font-weight="700">传播时延</text><text x="663" y="193" font-size="32" fill="#123e69" text-anchor="middle" font-weight="700">d / v</text><text x="58" y="226" font-size="14" fill="#31516d" text-anchor="start">L：分组位数；R：链路发送速率</text><text x="492" y="226" font-size="14" fill="#31516d" text-anchor="start">d：介质距离；v：信号传播速度</text><rect x="64" y="276" width="775" height="48" rx="8" fill="#fafcfe" stroke="#d5e0eb" stroke-width="1.7"/><text x="450" y="307" font-size="19" fill="#28445e" text-anchor="middle" font-weight="700">节点总时延 = 处理 + 排队 + 发送 + 传播</text></svg>