<text x="450" y="86" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace"></text>
<text x="450" y="86" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// Find：先找到根，再压缩路径</text>
<text x="450" y="103.4" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">int Find(int S[], int x) {</text>
<text x="450" y="120.8" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  int root = x;</text>
<text x="450" y="138.2" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  while (S[root] &gt;= 0)</text>
<text x="450" y="155.6" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    root = S[root];      </text>
<text x="630" y="155.6" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 循环找到根</text>
<text x="450" y="173" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  while (x != root) {    </text>
<text x="630" y="173" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 压缩路径</text>
<text x="450" y="190.4" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    int t = S[x];        </text>
<text x="630" y="190.4" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// t 指向 x 的父结点</text>
<text x="450" y="207.8" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    S[x] = root;         </text>
<text x="630" y="207.8" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// x 直接挂到根下</text>
<text x="450" y="225.2" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    x = t;</text>
<text x="450" y="242.6" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  }</text>
<text x="450" y="260" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  return root;</text>
<text x="450" y="277.4" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">}</text>
<text x="84" y="374.4" font-size="12.5" fill="#3f3f46" text-anchor="end">元素</text>
