<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="555" viewBox="0 0 1040 555"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect width="1040" height="555" fill="#ffffff"/><text x="44" y="50" font-size="27" font-weight="700" fill="#111827" font-family="Noto Sans CJK SC,sans-serif">单实例资源死锁环：每个进程都持有一个并请求另一个</text><path d="M44 67 H124" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><rect x="205.0" y="132.0" width="140" height="64" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="275" y="171" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="600" fill="#0f172a">进程 P1</text><rect x="678.0" y="132.0" width="140" height="64" rx="18" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="748" y="171" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="600" fill="#0f172a">资源 R2</text><rect x="678.0" y="335.0" width="140" height="64" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="748" y="374" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="600" fill="#0f172a">进程 P2</text><rect x="205.0" y="335.0" width="140" height="64" rx="18" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="275" y="374" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="600" fill="#0f172a">资源 R1</text><path d="M347 164 H673" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/><text x="508" y="148" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#1d4ed8">P1 请求 R2</text><path d="M748 198 V332" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><text x="778" y="270" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#047857">R2 分配给 P2</text><path d="M675 367 H352" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/><text x="510" y="353" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#1d4ed8">P2 请求 R1</text><path d="M275 330 V201" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><text x="248" y="270" text-anchor="end" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#047857">R1 分配给 P1</text><rect x="62" y="456" width="915" height="64" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/><text x="518" y="484" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="19" font-weight="600" fill="#9a3412">资源仅各 1 个实例：等待环 P1 → R2 → P2 → R1 → P1</text><text x="518" y="509" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#9a3412">多实例资源时“有环”并不充分，还需要结合可用实例与请求判断</text></svg>