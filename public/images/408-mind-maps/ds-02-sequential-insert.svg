<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc"><title id="title">顺序表插入示意</title><desc id="desc">在第二个逻辑位置插入 X，先从右向左挪动 B 和 C</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/></marker></defs>
<rect width="900" height="310" rx="18" fill="#f8fafc"/>
<text x="45" y="48" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#0f172a">插入前</text><rect x="235" y="17" width="100" height="54" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="285" y="53" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">A</text><rect x="363" y="17" width="100" height="54" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="413" y="53" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">B</text><rect x="491" y="17" width="100" height="54" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="541" y="53" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">C</text><rect x="619" y="17" width="100" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="669" y="53" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">—</text><text x="45" y="164" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#0f172a">插入后</text><rect x="235" y="132" width="100" height="54" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="285" y="168" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">A</text><rect x="363" y="132" width="100" height="54" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="413" y="168" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">X</text><rect x="491" y="132" width="100" height="54" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="541" y="168" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">B</text><rect x="619" y="132" width="100" height="54" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="669" y="168" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#0f172a">C</text><text x="235" y="110" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#64748b">下标 0</text><text x="363" y="110" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#64748b">1</text><text x="491" y="110" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#64748b">2</text><text x="619" y="110" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#64748b">3</text><text x="450" y="254" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#334155">从右向左移动 B、C，再写入 X</text><text x="450" y="290" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#64748b">逻辑插入位置 i = 2，原表长 n = 3，移动 n−i+1 = 2 个元素</text>
</svg>
