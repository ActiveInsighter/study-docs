<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="内存中的一个进程：程序运行时的内存映像与地址空间">
<title>内存中的一个进程：程序运行时的内存映像与地址空间</title>
<defs><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="698.5" height="458.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">程序运行的内存映像（虚拟地址空间）</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="260" y="60" width="220" height="34" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="370" y="80.8" font-size="11" fill="#1e3a8a" text-anchor="middle">操作系统内核区</text>
<rect x="260" y="94" width="220" height="40" rx="0" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="370" y="117.8" font-size="11" fill="#14532d" text-anchor="middle">用户栈（运行时创建）</text>
<rect x="260" y="134" width="220" height="34" rx="0" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<rect x="260" y="168" width="220" height="36" rx="0" fill="#efe9fb" stroke="#7856c9" stroke-width="1.5"/>
<text x="370" y="189.8" font-size="11" fill="#3b0764" text-anchor="middle">共享库的存储映射区</text>
<rect x="260" y="204" width="220" height="30" rx="0" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<rect x="260" y="234" width="220" height="40" rx="0" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<text x="370" y="257.9" font-size="11" fill="#78350f" text-anchor="middle">动态生成的堆（运行时由 malloc 创建）</text>
<rect x="260" y="274" width="220" height="34" rx="0" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="370" y="294.9" font-size="11" fill="#7f1d1d" text-anchor="middle">读 / 写数据段（.data、.bss）</text>
<rect x="260" y="308" width="220" height="40" rx="0" fill="#fde7e4" stroke="#d1493a" stroke-width="1.5"/>
<text x="370" y="331.9" font-size="11" fill="#7f1d1d" text-anchor="middle">只读代码段（.init、.text、.rodata）</text>
<rect x="260" y="348" width="220" height="26" rx="0" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="370" y="364.9" font-size="11" fill="#18181b" text-anchor="middle">未使用区</text>
<text x="370" y="156.9" font-size="14" fill="#3f3f46" text-anchor="middle">↓</text>
<text x="370" y="223.9" font-size="14" fill="#3f3f46" text-anchor="middle">↑</text>
<text x="252" y="63.7" font-size="10.5" fill="#3f3f46" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0xFFFFFFFF</text>
<text x="252" y="97.7" font-size="10.5" fill="#3f3f46" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0xC0000000</text>
<text x="252" y="207.7" font-size="10.5" fill="#3f3f46" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0x40000000</text>
<text x="252" y="351.7" font-size="10.5" fill="#3f3f46" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0x08048000</text>
<text x="252" y="377.7" font-size="10.5" fill="#3f3f46" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="490" y="80.8" font-size="11" fill="#3f3f46">用户代码不可见区</text>
<path d="M530 114L484 114" fill="none" stroke="#3f3f46" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="534" y="117.8" font-size="11" fill="#3f3f46">%esp（栈指针）</text>
<text x="490" y="189.8" font-size="11" fill="#3f3f46">共享函数库代码所在区域</text>
<path d="M484 274q8 0 8 8V303q0 8 8 8q-8 0 -8 8V340q0 8 -8 8" fill="none" stroke="#71717a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="506" y="307.4" font-size="11" fill="#71717a"><tspan x="506" dy="0">从可执行文件装入</tspan><tspan x="506" dy="14.9">的数据及代码</tspan></text>
<path d="M150 400L150 70" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="140" y="217.9" font-size="11.5" fill="#3f3f46" text-anchor="end"><tspan x="140" dy="0">地址从低到高</tspan><tspan x="140" dy="16.1">从下到上</tspan><tspan x="140" dy="16.1">（虚拟地址）</tspan></text>
<text x="370" y="446" font-size="10.5" fill="#71717a" text-anchor="middle">printf() 等共享库函数放在共享库映射区；.bss 是未初始化及初始化为 0 的全局 / 静态变量</text>
</svg>
