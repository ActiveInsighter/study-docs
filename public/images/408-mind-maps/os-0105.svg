<text x="150" y="124.2" font-size="12" fill="#78350f" text-anchor="middle">RAM</text>
<rect x="120" y="180" width="60" height="70" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="150" y="205.5" font-size="9.5" fill="#1e3a8a" text-anchor="middle"><tspan x="150" dy="0">ROM（BIOS）</tspan><tspan x="150" dy="12.8">含 ROM</tspan><tspan x="150" dy="12.8">引导程序</tspan></text>
<text x="150" y="266" font-size="11" fill="#d1493a" text-anchor="middle">主存</text>
<path d="M80 138L118 210" fill="none" stroke="#d1493a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="92" y="186" font-size="12" fill="#d1493a" text-anchor="middle">①</text>
<text x="250" y="214.2" font-size="12" fill="#18181b" text-anchor="end" font-weight="700">磁盘</text>
<rect x="260" y="190" width="160" height="40" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="340" y="206.6" font-size="10.5" fill="#18181b" text-anchor="middle"><tspan x="340" dy="0">主引导记录 MBR</tspan><tspan x="340" dy="14.2">（磁盘引导程序、分区表）</tspan></text>
<rect x="420" y="190" width="200" height="40" rx="0" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="520" y="214.2" font-size="12" fill="#14532d" text-anchor="middle">C 盘</text>
