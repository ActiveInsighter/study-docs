<text x="615" y="101.5" font-size="10" fill="#18181b" text-anchor="middle">空闲空间管理</text>
<rect x="660" y="76" width="90" height="44" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="705" y="101.5" font-size="10" fill="#18181b" text-anchor="middle">i 结点区</text>
<rect x="750" y="76" width="60" height="44" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
