<text x="700" y="214.2" font-size="12" fill="#14532d" text-anchor="middle">D 盘</text>
<text x="560" y="62" font-size="11.5" fill="#3f3f46" text-anchor="middle" font-weight="600">UNIX 文件系统（C 盘活动分区）</text>
<rect x="420" y="76" width="90" height="44" rx="0" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<text x="465" y="94.8" font-size="10" fill="#78350f" text-anchor="middle"><tspan x="465" dy="0">引导块（负责</tspan><tspan x="465" dy="13.5">初始化 OS）</tspan></text>
<rect x="510" y="76" width="60" height="44" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="540" y="101.5" font-size="10" fill="#18181b" text-anchor="middle">超级块</text>
