<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="操作系统引导步骤：BIOS 自检 → 读 MBR → 读分区引导记录 → 加载启动管理器与内核">
<title>操作系统引导步骤：BIOS 自检 → 读 MBR → 读分区引导记录 → 加载启动管理器与内核</title>
<defs><marker id="ad1493a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#d1493a"/></marker></defs>
<rect x="0.75" y="0.75" width="858.5" height="298.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">操作系统的引导</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="30" y="120" width="50" height="36" rx="4" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="55" y="142.2" font-size="12" fill="#1e3a8a" text-anchor="middle">CPU</text>
