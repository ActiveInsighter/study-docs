<path d="M340 188L182 160" fill="none" stroke="#d1493a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="260" y="162" font-size="10.5" fill="#d1493a" text-anchor="middle">② 读 MBR，执行磁盘引导程序</text>
<path d="M465 122L182 110" fill="none" stroke="#d1493a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="320" y="102" font-size="10.5" fill="#d1493a" text-anchor="middle">③ 读活动分区的引导块，加载 OS</text>
<text x="430" y="290" font-size="11" fill="#71717a" text-anchor="middle">① CPU 执行 ROM 中的引导程序（自检）　② 读 MBR、扫描分区表　③ 从活动分区的引导记录加载启动管理器 → 内核</text>
</svg>
