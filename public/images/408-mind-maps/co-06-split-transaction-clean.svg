<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 385" width="940" height="385" role="img" aria-label="co-06-split-transaction-clean" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="938" height="383" rx="16" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/><text x="34" y="48" font-size="27" fill="#203047" font-weight="700">分离式事务：请求占用与响应占用分开</text><text x="34" y="80" font-size="17" fill="#68758a">目标内部处理期间共享通路可以让给其他事务</text><path d="M34 97 L906 97" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round"/><text x="90" y="185" font-size="19" fill="#203047" text-anchor="end" font-weight="700">总线</text><path d="M112 168 L880 168" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="118" y="139" width="108" height="59" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="172" y="174" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">请求 A</text><rect x="235" y="139" width="330" height="59" rx="9" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/><text x="400" y="174" font-size="18" fill="#0d9488" text-anchor="middle" font-weight="600">其他事务可使用总线</text><rect x="574" y="139" width="116" height="59" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="632" y="174" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">响应 A</text><text x="90" y="277" font-size="19" fill="#203047" text-anchor="end" font-weight="700">目标A</text><rect x="230" y="241" width="335" height="57" rx="9" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="398" y="276" font-size="17" fill="#047857" text-anchor="middle" font-weight="600">内部读取 / 准备数据（不占总线）</text><path d="M222 199 L244 240" stroke="#68758a" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M554 239 L579 201" stroke="#68758a" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="43" y="327" width="851" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="467" y="353" font-size="17" fill="#203047" text-anchor="middle">Split 的重点是释放等待期总线资源；并不自动缩短目标方的内部处理延迟</text></svg>