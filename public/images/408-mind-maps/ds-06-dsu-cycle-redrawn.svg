<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="300" version="1.1" viewBox="0 0 900 300" width="900" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-dark" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M1,1 L9,5 L1,9 Z" fill="#192338" /></marker><marker id="arrow-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M1,1 L9,5 L1,9 Z" fill="#dc3545" /></marker></defs><rect fill="white" height="298" rx="16" stroke="#dce4ef" stroke-width="2" width="898" x="1" y="1" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" x="28" y="40">并查集：判断无向图加边是否成环</text><rect fill="#2563eb" height="3" rx="2" width="32" x="28" y="51" /><text fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="13" x="28" y="76">同一集合内再加边就形成环；该原理用于 Kruskal 排除回路</text><rect fill="#f7f9fc" height="160" rx="11" stroke="#dce4ef" stroke-width="1.2" width="274" x="22" y="84" /><line stroke="#2563eb" stroke-width="3" x1="88" x2="229" y1="150" y2="150" /><circle cx="88" cy="150" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="88" y="155">A</text><circle cx="229" cy="150" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="229" y="155">B</text><circle cx="159" cy="215" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="159" y="220">C</text><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="159" y="108">① 选边 A—B</text><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="14" text-anchor="middle" x="159" y="272">Find(A)≠Find(B) → 合并</text><rect fill="#f7f9fc" height="160" rx="11" stroke="#dce4ef" stroke-width="1.2" width="274" x="313" y="84" /><line stroke="#2563eb" stroke-width="3" x1="379" x2="520" y1="150" y2="150" /><line stroke="#2563eb" stroke-width="3" x1="379" x2="450" y1="150" y2="215" /><circle cx="379" cy="150" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="379" y="155">A</text><circle cx="520" cy="150" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="520" y="155">B</text><circle cx="450" cy="215" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="450" y="220">C</text><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="450" y="108">② 选边 A—C</text><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="14" text-anchor="middle" x="450" y="272">Find(A)≠Find(C) → 合并</text><rect fill="#f7f9fc" height="160" rx="11" stroke="#dce4ef" stroke-width="1.2" width="274" x="604" y="84" /><line stroke="#2563eb" stroke-width="3" x1="670" x2="811" y1="150" y2="150" /><line stroke="#2563eb" stroke-width="3" x1="670" x2="741" y1="150" y2="215" /><line stroke="#dc3545" stroke-dasharray="6,4" stroke-width="3" x1="811" x2="741" y1="150" y2="215" /><circle cx="670" cy="150" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="670" y="155">A</text><circle cx="811" cy="150" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="811" y="155">B</text><circle cx="741" cy="215" fill="#ffffff" r="19" stroke="#192338" stroke-width="2" /><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="741" y="220">C</text><text fill="#192338" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="741" y="108">③ 检查边 B—C</text><text fill="#dc3545" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="741" y="272">Find(B)=Find(C) → 拒绝</text></svg>