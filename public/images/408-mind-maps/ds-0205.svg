<text x="30" y="360" font-size="13.5" fill="#3f3f46">若树非空，先访问根结点，再依次先根遍历每棵子树</text>
<text x="30" y="392" font-size="15" fill="#18181b" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">遍历序列：A B E K F C G D H I J</text>
<text x="30" y="418" font-size="13.5" fill="#d1493a" font-weight="600">≡ 对应二叉树的先序遍历</text>
<text x="30" y="450" font-size="11.5" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">void PreOrder(TreeNode *R) {</text>
<text x="30" y="466.7" font-size="11.5" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  if (R != NULL) {</text>
<text x="30" y="483.4" font-size="11.5" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    visit(R);                 </text>
<text x="237" y="483.4" font-size="11.5" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 访问根结点</text>
<text x="30" y="500" font-size="11.5" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    while (R 还有下一个子树 T)</text>
<text x="30" y="516.7" font-size="11.5" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">      PreOrder(T);            </text>
<text x="237" y="516.7" font-size="11.5" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 先根遍历下一棵子树</text>
<text x="30" y="533.4" font-size="11.5" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  }</text>
<text x="30" y="550" font-size="11.5" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">}</text>
