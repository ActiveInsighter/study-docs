<path d="M430 330L430 364" fill="none" stroke="#d1493a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad1493a)"/>
<text x="430" y="380" font-size="12" fill="#d1493a" text-anchor="middle">Cₖ</text>
<text x="365" y="350" font-size="11" fill="#d1493a" text-anchor="middle">……</text>
<text x="350" y="402" font-size="10.5" fill="#d1493a" text-anchor="middle">每个输出的控制信号对应一个微命令；如 C₁ 对应 (PC)→MAR，就让 C₁ 接到 PCout 和 MARin 上</text>
