<text x="145" y="346" font-size="10.5" fill="#c98a12" text-anchor="middle">每个时钟周期发出一个节拍信号（循环）</text>
</g>
<g opacity="1">
<path d="M620 186L462 186" fill="none" stroke="#c98a12" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac98a12)"/>
