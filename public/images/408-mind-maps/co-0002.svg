<text x="640" y="262" font-size="10.5" fill="#2f8f57"><tspan x="640" dy="0">标志（来自执行单元</tspan><tspan x="640" dy="14.7">的反馈：PSW、ACC、</tspan><tspan x="640" dy="14.7">I/O 设备、主存等）</tspan></text>
</g>
<g opacity="0.28">
