<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="同轴电缆的结构：内导体、绝缘层、网状编织屏蔽层、塑料外层">
<title>同轴电缆的结构：内导体、绝缘层、网状编织屏蔽层、塑料外层</title>
<rect x="0.75" y="0.75" width="598.5" height="238.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">同轴电缆的结构</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="40" y="90" width="520" height="80" rx="40" fill="#3f3f46" stroke="#52525b" stroke-width="1.2"/>
<rect x="120" y="98" width="440" height="64" rx="32" fill="#c98a12" stroke="#52525b" stroke-width="1.2"/>
<rect x="200" y="108" width="360" height="44" rx="22" fill="#ffffff" stroke="#52525b" stroke-width="1.2"/>
<rect x="280" y="123" width="280" height="14" rx="7" fill="#c98a12" stroke="#52525b" stroke-width="1.2"/>
<path d="M60 90L60 70" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="60" font-size="11.5" fill="#18181b" text-anchor="middle" font-weight="600">塑料外层</text>
<path d="M140 98L140 70" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="140" y="60" font-size="11.5" fill="#18181b" text-anchor="middle" font-weight="600">网状编织屏蔽层</text>
<path d="M220 108L220 70" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="220" y="60" font-size="11.5" fill="#18181b" text-anchor="middle" font-weight="600">绝缘层</text>
<path d="M300 123L300 70" fill="none" stroke="#3f3f46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="60" font-size="11.5" fill="#18181b" text-anchor="middle" font-weight="600">内导体（铜芯）</text>
<text x="300" y="210" font-size="11" fill="#71717a" text-anchor="middle">抗干扰性比双绞线好，传输距离更远，常用于有线电视</text>
</svg>
