<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">④ 2 路组相联映射：28 位主存地址的划分</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="96" y="80" width="248" height="40" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="220" y="104.7" font-size="13.5" fill="#1e3a8a" text-anchor="middle">标记 20 bit</text>
<rect x="344" y="80" width="60" height="40" rx="0" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
