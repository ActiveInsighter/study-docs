<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="470" version="1.1" viewBox="0 0 1060 470" width="1060" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="470" rx="12" stroke="#cdd9e8" stroke-width="1.6" width="1060" x="0" y="0" /><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="30" y="44">TCP 与 UDP：同一应用写入，不同交付语义</text><text fill="#48647b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="30" y="78">TCP是连续字节流；UDP维持应用发送的报文边界。两者都依靠IP尽最大努力交付。</text><line stroke="#cdd9e8" stroke-width="1.5" x1="30" x2="1030" y1="94" y2="94" /><rect fill="#f1f7ff" height="315" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="476" x="30" y="115" /><rect fill="#ecfaf5" height="315" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="474" x="556" y="115" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="start" x="65" y="151">TCP（面向字节流）</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="start" x="591" y="151">UDP（面向报文）</text><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="55" y="194">应用调用：write("ABC") + write("DEF")</text><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="579" y="194">应用调用：send(M1) + send(M2)</text><rect fill="#dceafd" height="47" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="131" x="65" y="211" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="130" y="243">A B C</text><rect fill="#dceafd" height="47" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="131" x="212" y="211" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="277" y="243">D E F</text><rect fill="#dcf4e8" height="47" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="184" x="579" y="211" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="671" y="242">M1</text><rect fill="#dcf4e8" height="47" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="184" x="794" y="211" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="886" y="242">M2</text><line stroke="#275dad" stroke-width="2" x1="286" x2="286" y1="264" y2="293" /><polygon fill="#275dad" points="286,293 280.99755037084947,282.09241100390136 291.00244962915053,282.09241100390136" /><line stroke="#15766d" stroke-width="2" x1="793" x2="793" y1="264" y2="293" /><polygon fill="#15766d" points="793,293 787.9975503708495,282.09241100390136 798.0024496291505,282.09241100390136" /><rect fill="#ffffff" height="55" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="388" x="75" y="302" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="269" y="338">字节 ABCDEF → 无消息边界</text><rect fill="#ffffff" height="55" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="184" x="579" y="302" /><rect fill="#ffffff" height="55" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="184" x="794" y="302" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="671" y="336">M1（完整报文）</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="886" y="336">M2（完整报文）</text><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="52" y="392">接收者可能 read 2B + 4B，或一次读6B</text><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="575" y="392">成功收到时保持 M1 与 M2 的边界</text></svg>