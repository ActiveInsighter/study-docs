<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="两个路由器之间直接相连时，链路上的帧可以是 PPP 帧">
<title>两个路由器之间直接相连时，链路上的帧可以是 PPP 帧</title>
<rect x="0.75" y="0.75" width="558.5" height="158.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<circle cx="90" cy="70" r="26" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="90" y="75.6" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="500">⇄</text>
<text x="90" y="120" font-size="12.5" fill="#3f3f46" text-anchor="middle">路由器 0</text>
<circle cx="280" cy="70" r="26" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="280" y="75.6" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="500">⇄</text>
<text x="280" y="120" font-size="12.5" fill="#3f3f46" text-anchor="middle">路由器 1</text>
<path d="M116 70L254 70" fill="none" stroke="#d1493a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="470" cy="70" r="26" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="470" y="75.6" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="500">⇄</text>
<text x="470" y="120" font-size="12.5" fill="#3f3f46" text-anchor="middle">路由器 2</text>
<path d="M306 70L444 70" fill="none" stroke="#d1493a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="280" y="146" font-size="11" fill="#71717a" text-anchor="middle">点对点链路：可使用 PPP 帧</text>
