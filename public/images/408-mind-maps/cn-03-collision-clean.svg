f3ff" height="54" rx="8" stroke="#2468cb" stroke-width="2" width="600" x="212" y="373" /><text fill="#1c3147" font-family="Noto Sans CJK SC, sans-serif" font-size="23" text-anchor="middle" x="512.0" y="407.82">发送时长 ≥ 2Tp，最短帧 Lmin ≥ 2Tp × R</text></svg>