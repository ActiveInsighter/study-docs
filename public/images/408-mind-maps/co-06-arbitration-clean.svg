<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="co-06-arbitration-clean" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="958" height="538" rx="16" fill="#ffffff" stroke="#d8e2ee" stroke-width="1.5"/><text x="34" y="48" font-size="27" fill="#203047" font-weight="700">三种集中式总线仲裁</text><text x="34" y="80" font-size="17" fill="#68758a">请求者都可能是 CPU、DMA 等主设备；比较优先级、公平性和线数</text><path d="M34 97 L926 97" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="43" y="116" width="260" height="344" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="173" y="158" font-size="20" fill="#203047" text-anchor="middle" font-weight="700">链式查询（菊花链）</text><rect x="350" y="116" width="260" height="344" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="480" y="158" font-size="20" fill="#203047" text-anchor="middle" font-weight="700">计数器定时查询</text><rect x="657" y="116" width="260" height="344" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="787" y="158" font-size="20" fill="#203047" text-anchor="middle" font-weight="700">独立请求</text><rect x="58" y="190" width="81" height="41" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="98" y="217" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">仲裁器</text><rect x="159" y="190" width="42" height="41" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="180" y="216" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">D1</text><rect x="204" y="190" width="42" height="41" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="225" y="216" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">D2</text><rect x="249" y="190" width="42" height="41" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="270" y="216" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">D3</text><path d="M98 232 L98 242 L270 242 M180 242 L180 232 M225 242 L225 232 M270 242 L270 232" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="184" y="268" font-size="15" fill="#68758a" text-anchor="middle">Grant依次传递</text><text x="173" y="311" font-size="18" fill="#203047" text-anchor="middle" font-weight="600">近端固定高优先级</text><text x="173" y="343" font-size="16" fill="#68758a" text-anchor="middle">线少、可能饥饿</text><rect x="405" y="193" width="151" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="480" y="221" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">计数器+译码</text><rect x="376" y="277" width="57" height="39" rx="7" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="405" y="303" font-size="16" fill="#047857" text-anchor="middle" font-weight="600">D1</text><rect x="454" y="277" width="57" height="39" rx="7" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="483" y="303" font-size="16" fill="#047857" text-anchor="middle" font-weight="600">D2</text><rect x="532" y="277" width="57" height="39" rx="7" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="561" y="303" font-size="16" fill="#047857" text-anchor="middle" font-weight="600">D3</text><path d="M480 239 L480 267" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="480" y="343" font-size="18" fill="#203047" text-anchor="middle" font-weight="600">按设备编号扫描</text><text x="480" y="373" font-size="16" fill="#68758a" text-anchor="middle">起点可决定公平性</text><rect x="720" y="188" width="134" height="51" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="787" y="220" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">仲裁器</text><rect x="687" y="307" width="56" height="39" rx="7" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/><text x="715" y="333" font-size="16" fill="#047857" text-anchor="middle" font-weight="600">D1</