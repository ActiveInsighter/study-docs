<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="脱机输入 / 输出技术：在外围控制机控制下用磁带缓解速度矛盾">
<title>脱机输入 / 输出技术：在外围控制机控制下用磁带缓解速度矛盾</title>
<defs><marker id="a3b6fd4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3b6fd4"/></marker><marker id="ac98a12" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#c98a12"/></marker></defs>
<rect x="0.75" y="0.75" width="758.5" height="278.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">脱机输入 / 输出（批处理阶段）</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="30" y="70" width="100" height="44" rx="8" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="80" y="96.4" font-size="12.5" fill="#18181b" text-anchor="middle">用户</text>
<rect x="150" y="70" width="100" height="44" rx="8" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="200" y="96.4" font-size="12.5" fill="#18181b" text-anchor="middle">纸带 / 卡片</text>
<rect x="280" y="70" width="100" height="44" rx="8" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="330" y="96.4" font-size="12.5" fill="#1e3a8a" text-anchor="middle">外围控制机</text>
<rect x="430" y="70" width="100" height="44" rx="8" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="480" y="96.4" font-size="12.5" fill="#18181b" text-anchor="middle">磁带</text>
<rect x="580" y="70" width="100" height="44" rx="8" fill="#efe9fb" stroke="#7856c9" stroke-width="1.5"/>
<text x="630" y="96.4" font-size="12.5" fill="#3b0764" text-anchor="middle">主机</text>
<path d="M130 92L148 92" fill="none" stroke="#3b6fd4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<path d="M250 92L278 92" fill="none" stroke="#3b6fd4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<path d="M380 92L428 92" fill="none" stroke="#3b6fd4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<path d="M530 92L578 92" fill="none" stroke="#3b6fd4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<text x="555" y="82" font-size="10.5" fill="#3f3f46" text-anchor="middle">速度更快</text>
<text x="480" y="128" font-size="10.5" fill="#3f3f46" text-anchor="middle">比纸带机快</text>
<rect x="580" y="170" width="100" height="44" rx="8" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<text x="630" y="196.4" font-size="12.5" fill="#18181b" text-anchor="middle">磁带</text>
<path d="M630 116L630 168" fill="none" stroke="#c98a12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac98a12)"/>
<rect x="430" y="170" width="100" height="44" rx="8" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<text x="480" y="196.4" font-size="12.5" fill="#78350f" text-anchor="middle">外围控制机</text>
<rect x="280" y="170" width="100" height="44" rx="8" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="330" y="196.4" font-size="12.5" fill="#18181b" text-anchor="middle">打印机 / 纸带</text>
<path d="M578 192L532 192" fill="none" stroke="#c98a12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac98a12)"/>
<path d="M428 192L382 192" fill="none" stroke="#c98a12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac98a12)"/>
<rect x="30" y="150" width="220" height="74" rx="8" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="140" y="169.4" font-size="10.5" fill="#14532d" text-anchor="middle"><tspan x="140" dy="0">在外围控制机的控制下，慢速输入设备的</tspan><tspan x="140" dy="14.2">数据先被输入到更快速的磁带上；之后</tspan><tspan x="140" dy="14.2">主机可以从快速的磁带上读入数据，</tspan><tspan x="140" dy="14.2">从而缓解了速度矛盾</tspan></text>
<text x="480" y="238" font-size="11" fill="#3f3f46" text-anchor="middle">输出时类似</text>
</svg>
