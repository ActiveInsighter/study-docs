<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1245 475" width="1245" height="475" role="img" aria-label="FTP：主动 PORT 与被动 PASV 连接方向" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>FTP：主动 PORT 与被动 PASV 连接方向</title><rect width="1245" height="475" rx="18" fill="#ffffff"/><rect x="1" y="1" width="1243" height="473" rx="18" fill="none" stroke="#d9e3ec" stroke-width="2"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9z" fill="#3b5c82"/></marker></defs><text x="40" y="50" font-size="26" fill="#182e46" font-weight="700">FTP：主动 PORT 与被动 PASV 连接方向</text><line x1="40" y1="67" x2="1205" y2="67" stroke="#e1e8f0" stroke-width="2"/><text x="280" y="106" fill="#1b314c" font-size="22" font-weight="700" text-anchor="middle">主动模式 PORT</text><text x="900" y="106" fill="#1b314c" font-size="22" font-weight="700" text-anchor="middle">被动模式 PASV</text><rect x="60" y="138" width="230" height="86" rx="12" fill="#e9f3ff" stroke="#8daac9" stroke-width="2"/><text x="175.0" y="168" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">FTP 客户端</text><text x="175.0" y="198" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">发起控制连接</text><rect x="370" y="138" width="230" height="86" rx="12" fill="#eff8ed" stroke="#8daac9" stroke-width="2"/><text x="485.0" y="168" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">FTP 服务器</text><text x="485.0" y="198" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">监听 TCP 21</text><line x1="293" y1="172" x2="367" y2="172" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="330.0" y="152" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">控制通道</text><rect x="655" y="138" width="230" height="86" rx="12" fill="#e9f3ff" stroke="#8daac9" stroke-width="2"/><text x="770.0" y="168" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">FTP 客户端</text><text x="770.0" y="198" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">发起控制连接</text><rect x="965" y="138" width="230" height="86" rx="12" fill="#eff8ed" stroke="#8daac9" stroke-width="2"/><text x="1080.0" y="168" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">FTP 服务器</text><text x="1080.0" y="198" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">监听 TCP 21</text><line x1="888" y1="172" x2="962" y2="172" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="925.0" y="152" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">控制通道</text><rect x="60" y="296" width="230" height="82" rx="12" fill="#fff6e8" stroke="#e4ad68" stroke-width="2"/><text x="175.0" y="326" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">客户端数据端口</text><text x="175.0" y="356" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">客户端监听选定端口</text><rect x="370" y="296" width="230" height="82" rx="12" fill="#fff6e8" stroke="#e4ad68" stroke-width="2"/><text x="485.0" y="326" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">服务器源端口 20</text><text x="485.0" y="356" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">服务器主动发起数据 TCP</text><line x1="368" y1="340" x2="295" y2="340" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="331.5" y="321" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">数据连接</text><rect x="655" y="296" width="230" height="82" rx="12" fill="#fff6e8" stroke="#e4ad68" stroke-width="2"/><text x="770.0" y="326" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">客户端临时端口</text><text x="770.0" y="356" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">客户端主动连接服务器</text><rect x="965" y="296" width="230" height="82" rx="12" fill="#fff6e8" stroke="#e4ad68" stroke-width="2"/><text x="1080.0" y="326" fill="#1b314c" font-size="19" font-weight="700" text-anchor="middle">服务器协商端口</text><text x="1080.0" y="356" fill="#566b80" font-size="15" font-weight="400" text-anchor="middle">通过 PASV/EPSV 告知</text><line x1="890" y1="340" x2="962" y2="340" stroke="#3b5c82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="926.0" y="321" fill="#344d68" font-size="15" font-weight="400" text-anchor="middle">数据连接</text><text x="600" y="422" fill="#5b7087" font-size="17" font-weight="400" text-anchor="middle">两个模式都有 TCP 21 控制连接；区别是数据 TCP 的发起方和服务器数据端口。</text><text x="600" y="448" fill="#5b7087" font-size="16" font-weight="400" text-anchor="middle">经典主动模式通常使用服务器端口 20；被动端口由服务端配置与协商，不存在固定统一范围。</text></svg>