<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="co-03-dram-row-column-clean.svg"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#446d9b" stroke-width="2" /></marker></defs><rect x="0" y="0" width="960" height="430" rx="20" fill="#fff" stroke="#d5e0ea" stroke-width="2" /><text x="30" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10283d">DRAM 行列地址复用与读取示意</text><line x1="30" y1="53" x2="930" y2="53" stroke="#d9e5ef" stroke-width="2"/><text x="31" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526579">同一组地址引脚分时发送行号与列号；RAS/CAS信号控制译码（教材抽象模型）</text><rect x="50" y="125" width="205" height="80" rx="9" fill="#ecf4fd" stroke="#9db4c7" stroke-width="2" /><text x="152" y="157" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#18354d">外部地址线</text><text x="152" y="191" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#18354d">A[9:0]（10根）</text><rect x="335" y="122" width="230" height="83" rx="9" fill="#fff4df" stroke="#9db4c7" stroke-width="2" /><text x="450" y="158" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#18354d">行地址锁存</text><text x="450" y="186" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">RAS 触发</text><rect x="335" y="252" width="230" height="83" rx="9" fill="#ecf7ee" stroke="#9db4c7" stroke-width="2" /><text x="450" y="290" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#18354d">列地址锁存</text><text x="450" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#18354d">CAS 触发</text><rect x="660" y="125" width="255" height="205" rx="9" fill="#f4f1ff" stroke="#9db4c7" stroke-width="2" /><text x="788" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#18354d">DRAM阵列</text><text x="787" y="206" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#18354d">1024 行 × 1024 列</text><text x="787" y="251" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#18354d">感测放大器 + 读写</text><line x1="257" y1="164" x2="331" y2="164" stroke="#446d9b" stroke-width="3" marker-end="url(#arrow)" /><line x1="257" y1="164" x2="290" y2="164" stroke="#446d9b" stroke-width="3" marker-end="url(#arrow)" /><line x1="290" y1="164" x2="290" y2="295" stroke="#556d81" stroke-width="3"/><line x1="290" y1="295" x2="331" y2="295" stroke="#446d9b" stroke-width="3" marker-end="url(#arrow)" /><line x1="569" y1="164" x2="652" y2="164" stroke="#446d9b" stroke-width="3" marker-end="url(#arrow)" /><line x1="569" y1="292" x2="650" y2="292" stroke="#446d9b" stroke-width="3" marker-end="url(#arrow)" /><text x="50" y="383" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#a04e1c">外部地址引脚 10 根 ≠ 内部 1024+1024 根译码选通信号</text></svg>