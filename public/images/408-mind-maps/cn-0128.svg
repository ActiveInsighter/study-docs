<text x="650" y="70" font-size="13" fill="#3b6fd4" text-anchor="middle" font-weight="700">FTP 服务器</text>
<path d="M182 155L294.2 121.7Q300 120 306 120L494 120Q500 120 505.9 120.9L598 135" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="400" y="104" font-size="11" fill="#d1493a" text-anchor="middle">TCP 控制连接 端口 21</text>
<path d="M182 225L294 239.2Q300 240 306 240L494 240Q500 240 505.8 238.5L598 215" fill="none" stroke="#3f3f46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<text x="400" y="262" font-size="11" fill="#d1493a" text-anchor="middle">TCP 数据连接 端口 20</text>
<text x="400" y="84" font-size="11" fill="#d1493a" text-anchor="middle" font-weight="600">始终打开</text>
<text x="400" y="284" font-size="11" fill="#d1493a" text-anchor="middle">只会保持一会，数据发送完就关闭</text>
<text x="400" y="310" font-size="11" fill="#3b6fd4" text-anchor="middle">主动模式用 20 端口；被动模式由双方协商（&gt;1024），与传输模式有关</text>
<text x="130" y="314" font-size="10.5" fill="#2f8f57" text-anchor="middle">（都属于从属进程）</text>
