<ellipse cx="40" cy="230" rx="20" ry="30" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
<ellipse cx="400" cy="170" rx="110" ry="60" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="400" y="174.9" font-size="14" fill="#3f3f46" text-anchor="middle" font-weight="500">因特网</text>
<rect x="580" y="100" width="140" height="160" rx="4" fill="none" stroke="#3f3f46" stroke-width="1.2"/>
<text x="650" y="276" font-size="11" fill="#3f3f46" text-anchor="middle">服务器端</text>
<rect x="600" y="120" width="100" height="30" rx="4" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="650" y="139" font-size="11.5" fill="#14532d" text-anchor="middle">控制进程</text>
