<rect x="80" y="74" width="100" height="30" rx="4" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="130" y="93" font-size="11.5" fill="#18181b" text-anchor="middle">用户界面</text>
<rect x="80" y="140" width="100" height="30" rx="4" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="130" y="159" font-size="11.5" fill="#14532d" text-anchor="middle">控制进程</text>
