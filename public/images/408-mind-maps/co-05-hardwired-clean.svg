<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 485" width="1050" height="485" role="img" aria-label="硬布线CU：OP、阶段、节拍、标志 → 控制信号" style="font-family: Noto Sans CJK SC, sans-serif;">
<title>硬布线CU：OP、阶段、节拍、标志 → 控制信号</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="#64748B"/></marker><marker id="arrowblue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="#2563EB"/></marker></defs>
<rect width="1050" height="485" rx="18" fill="white" stroke="#CFD8E3" stroke-width="2"/>
<text x="32" y="46" font-size="24" font-weight="700" fill="#17243A">硬布线CU：OP、阶段、节拍、标志 → 控制信号</text>
<rect x="32" y="57" width="62" height="5" rx="2.5" fill="#2563EB"/>
