<text x="401.0" y="140.5" text-anchor="middle" fill="#B45309" font-size="19" font-weight="700">阶段状态</text>
<text x="401.0" y="164.9" text-anchor="middle" fill="#17243A" font-size="14" font-weight="400">FE / IND / EX / INT</text>
