<text x="657.0" y="140.5" text-anchor="middle" fill="#7C3AED" font-size="19" font-weight="700">时间信号</text>
<text x="657.0" y="164.9" text-anchor="middle" fill="#17243A" font-size="14" font-weight="400">T0、T1、T2…</text>
<line x1="657" y1="193" x2="657" y2="250" stroke="#64748B" stroke-width="2"/>
<rect x="799" y="104" width="228" height="87" rx="10" fill="#D1FAE5" stroke="#0F766E" stroke-width="1.5"/>
