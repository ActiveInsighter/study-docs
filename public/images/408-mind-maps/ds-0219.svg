<text x="290" y="94.9" font-size="14" fill="#14532d" text-anchor="middle" font-weight="500">6</text>
<circle cx="380" cy="90" r="19" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
<text x="380" y="94.9" font-size="14" fill="#14532d" text-anchor="middle" font-weight="500">2</text>
