<text x="335" y="164.9" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="500">8</text>
<circle cx="235" cy="230" r="19" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="235" y="234.9" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="500">14</text>
<circle cx="120" cy="230" r="19" fill="#e3f4e8" stroke="#2f8f57" stroke-width="1.5"/>
