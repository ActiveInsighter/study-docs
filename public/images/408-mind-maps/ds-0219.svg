<text x="163" y="164" font-size="12" fill="#d1493a">读写各 6 次</text>
<text x="363" y="164" font-size="12" fill="#d1493a">读写各 8 次</text>
<text x="263" y="234" font-size="12" fill="#d1493a">读写各 14 次</text>
<text x="206" y="304" font-size="12" fill="#d1493a">读写各 16 次</text>
<rect x="470" y="120" width="200" height="56" rx="10" fill="#efe9fb" stroke="#7856c9" stroke-width="1.5"/>
<text x="570" y="143.8" font-size="13" fill="#3b0764" text-anchor="middle"><tspan x="570" dy="0">想让 I/O 次数最少</tspan><tspan x="570" dy="17.6">→ WPL 最小 → 哈夫曼树</tspan></text>
<text x="350" y="354" font-size="14" fill="#3f3f46" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">WPL = 2×1 + (5+1+6+2)×3 = 44 = 读盘次数 = 写盘次数</text>
<text x="350" y="380" font-size="13.5" fill="#d1493a" text-anchor="middle" font-weight="600">结论：归并过程中的磁盘 I/O 次数 = 归并树的 WPL × 2</text>
