<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="268" version="1.1" viewBox="0 0 880 268" width="880" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="266" rx="13" stroke="#ccd8e8" stroke-width="2" width="878" x="1" y="1" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" x="24" y="35">B 树非叶结点：k 个关键字，对应 k+1 个指针</text><text fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" x="24" y="60">按 408 常用 B 树约定；k 为结点实际关键字数（区别于全树关键字总数 n）</text><line stroke="#ccd8e8" stroke-width="1.3" x1="24" x2="856" y1="71" y2="71" /><rect fill="white" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="44" y="92" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle" x="88" y="120">k</text><rect fill="#f5f9ff" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="132" y="92" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle" x="176" y="120">P0</text><rect fill="#dceafd" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="220" y="92" /><text fill="#245db7" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="264" y="120">K1</text><rect fill="#f5f9ff" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="308" y="92" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle" x="352" y="120">P1</text><rect fill="#dceafd" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="396" y="92" /><text fill="#245db7" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="440" y="120">K2</text><rect fill="#f5f9ff" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="484" y="92" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle" x="528" y="120">P2</text><rect fill="white" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="572" y="92" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle" x="616" y="120">…</text><rect fill="#dceafd" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="660" y="92" /><text fill="#245db7" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="704" y="120">Kk</text><rect fill="#f5f9ff" height="46" stroke="#ccd8e8" stroke-width="1" width="88" x="748" y="92" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle" x="792" y="120">Pk</text><line stroke="#64748b" stroke-width="1.4" x1="176" x2="176" y1="138" y2="166" /><polygon fill="#64748b" points="171,161 181,161 176,170" /><line stroke="#64748b" stroke-width="1.4" x1="352" x2="352" y1="138" y2="166" /><polygon fill="#64748b" points="347,161 357,161 352,170" /><line stroke="#64748b" stroke-width="1.4" x1="528" x2="528" y1="138" y2="166" /><polygon fill="#64748b" points="523,161 533,161 528,170" /><line stroke="#64748b" stroke-width="1.4" x1="792" x2="792" y1="138" y2="166" /><polygon fill="#64748b" points="787,161 797,161 792,170" /><text fill="#1b2b44" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="14" x="44" y="198">关键字范围：P0 的键 &lt; K1；Pi 在 Ki 与 K(i+1) 之间；Pk 的键 &gt; Kk</text><text fill="#245db7" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" x="44" y="226">非根结点： ceil(m/2)−1 ≤ k ≤ m−1；非终端结点必须有 k+1 棵子树</text><text fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" x="44" y="248">根是例外：非空根至少 1 个关键字；非终端根至少 2 个孩子</text></svg>