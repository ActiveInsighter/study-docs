<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="无缓冲时的处理时间：磁盘→缓冲区 100us，缓冲区→用户区 50us，CPU 分析 50us">
<title>无缓冲时的处理时间：磁盘→缓冲区 100us，缓冲区→用户区 50us，CPU 分析 50us</title>
<defs><marker id="a3b6fd4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3b6fd4"/></marker><marker id="a3f3f46" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.8L8.5 5 0 9.2z" fill="#3f3f46"/></marker></defs>
<rect x="0.75" y="0.75" width="698.5" height="328.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">计算周期（假设工作区已满）</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<rect x="40" y="56" width="110" height="28" rx="4" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="95" y="74" font-size="11.5" fill="#1e3a8a" text-anchor="middle">磁盘</text>
<path d="M152 70L196 70" fill="none" stroke="#3b6fd4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<text x="174" y="96" font-size="11" fill="#3f3f46" text-anchor="middle">100us</text>
<rect x="200" y="56" width="110" height="28" rx="4" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="255" y="74" font-size="11.5" fill="#1e3a8a" text-anchor="middle">缓冲区</text>
<path d="M312 70L356 70" fill="none" stroke="#3b6fd4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<text x="334" y="96" font-size="11" fill="#3f3f46" text-anchor="middle">50us</text>
<rect x="360" y="56" width="110" height="28" rx="4" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="415" y="74" font-size="11.5" fill="#1e3a8a" text-anchor="middle">用户区（工作区）</text>
<path d="M472 70L516 70" fill="none" stroke="#3b6fd4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3b6fd4)"/>
<text x="494" y="96" font-size="11" fill="#3f3f46" text-anchor="middle">50us</text>
<rect x="520" y="56" width="70" height="28" rx="4" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="555" y="74" font-size="11.5" fill="#1e3a8a" text-anchor="middle">分析</text>
<text x="640" y="96" font-size="11" fill="#3f3f46" text-anchor="middle">50us</text>
<text x="110" y="154" font-size="11.5" fill="#3f3f46" text-anchor="end">磁盘 → 缓冲区</text>
<text x="110" y="194" font-size="11.5" fill="#3f3f46" text-anchor="end">缓冲区 → 用户区</text>
<text x="110" y="234" font-size="11.5" fill="#3f3f46" text-anchor="end">CPU 分析</text>
<path d="M120 270L680 270" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<path d="M120 270L120 120" fill="none" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3f3f46)"/>
<rect x="130" y="144" width="100" height="10" rx="2" fill="#52525b" stroke="none" stroke-width="0"/>
<rect x="230" y="184" width="50" height="10" rx="2" fill="#2f8f57" stroke="none" stroke-width="0"/>
<rect x="280" y="224" width="50" height="10" rx="2" fill="#c98a12" stroke="none" stroke-width="0"/>
<rect x="280" y="144" width="100" height="10" rx="2" fill="#52525b" stroke="none" stroke-width="0"/>
<rect x="380" y="184" width="50" height="10" rx="2" fill="#2f8f57" stroke="none" stroke-width="0"/>
<rect x="430" y="224" width="50" height="10" rx="2" fill="#c98a12" stroke="none" stroke-width="0"/>
<rect x="460" y="144" width="100" height="10" rx="2" fill="#52525b" stroke="none" stroke-width="0"/>
<rect x="560" y="184" width="50" height="10" rx="2" fill="#2f8f57" stroke="none" stroke-width="0"/>
<rect x="610" y="224" width="50" height="10" rx="2" fill="#c98a12" stroke="none" stroke-width="0"/>
<text x="440" y="190" font-size="14" fill="#71717a" text-anchor="middle">……</text>
<text x="130" y="288" font-size="11" fill="#3f3f46" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">0</text>
<text x="230" y="288" font-size="11" fill="#3f3f46" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">100</text>
<text x="280" y="288" font-size="11" fill="#3f3f46" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">150</text>
<text x="610" y="288" font-size="11" fill="#3f3f46" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">1500</text>
<text x="400" y="318" font-size="11.5" fill="#71717a" text-anchor="middle">单缓冲：每块的处理时间为 max(C, T) + M = 150us</text>
</svg>
