<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="610" version="1.1" viewBox="0 0 1100 610" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="610" rx="12" stroke="#cdd9e8" stroke-width="1.6" width="1100" x="0" y="0" /><text fill="#172d42" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="30" y="44">TCP 正常释放：四次挥手与 2MSL</text><text fill="#48647b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" text-anchor="start" x="30" y="78">A主动关闭发送方向；B仍能发送剩余数据，FIN与普通ACK的序号消耗不同。</text><line stroke="#cdd9e8" stroke-width="1.5" x1="30" x2="1070" y1="94" y2="94" /><rect fill="#e9f1ff" height="56" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="350" x="56" y="112" /><rect fill="#e7f8ef" height="56" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="350" x="692" y="112" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="230" y="149">主动关闭方 A</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="867" y="149">被动关闭方 B</text><line stroke="#48647b" stroke-dasharray="6 7" stroke-width="2" x1="234" x2="234" y1="184" y2="561" /><line stroke="#48647b" stroke-dasharray="6 7" stroke-width="2" x1="858" x2="858" y1="184" y2="561" /><line stroke="#275dad" stroke-width="3" x1="234" x2="858" y1="218" y2="256" /><polygon fill="#275dad" points="858,256 846.8085072569025,260.3301836198015 847.4166533574796,250.34378449453587" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="550" y="228.0">① FIN seq=u</text><line stroke="#15766d" stroke-width="3" x1="858" x2="234" y1="293" y2="329" /><polygon fill="#15766d" points="234,329 244.6013579965519,323.37761539656486 245.1776055278213,333.3659059385675" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="550" y="302.0">② ACK ack=u+1</text><line stroke="#15766d" stroke-width="3" x1="858" x2="234" y1="372" y2="405" /><polygon fill="#15766d" points="234,405 244.6281843883833,399.4284924296448 245.15655128984594,409.4194302027566" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="550" y="379.5">③ FIN seq=v</text><line stroke="#275dad" stroke-width="3" x1="234" x2="858" y1="452" y2="484" /><polygon fill="#275dad" points="858,484 846.8505262143082,488.43725526673535 847.3629246483384,478.445485803144" /><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="550" y="459.0">④ ACK ack=v+1</text><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="240" y="211">FIN-WAIT-1</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="end" x="847" y="356">CLOSE-WAIT</text><text fill="#275dad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" x="241" y="355">FIN-WAIT-2</text><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="end" x="844" y="440">LAST-ACK</text><rect fill="#fff4ea" height="57" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="315" x="63" y="520" /><text fill="#a54b26" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="220" y="555">A: TIME-WAIT 等待 2MSL</text><rect fill="#eef8f4" height="57" rx="9" stroke="#cdd9e8" stroke-width="1.6" width="310" x="731" y="520" /><text fill="#15766d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="887" y="555">B: 收到末次ACK → CLOSED</text></svg>