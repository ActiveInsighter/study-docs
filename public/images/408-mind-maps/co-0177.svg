<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif" font-size="15" xml:space="preserve" style="white-space:pre" role="img" aria-label="内存映射 I/O 与独立编址 I/O 的对比">
<title>内存映射 I/O 与独立编址 I/O 的对比</title>
<rect x="0.75" y="0.75" width="758.5" height="418.5" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="24" y="34" font-size="17" fill="#18181b" font-weight="700">内存映射 I/O vs 独立编址 I/O</text>
<rect x="24" y="44" width="28" height="3" rx="1.5" fill="#18181b"/>
<text x="170" y="64" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">内存映射 I/O</text>
<text x="36" y="84" font-size="11" fill="#71717a" text-anchor="middle">地址</text>
<rect x="60" y="90" width="140" height="90" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="130" y="139.6" font-size="13" fill="#1e3a8a" text-anchor="middle">内存</text>
<rect x="60" y="180" width="60" height="24" rx="0" fill="#fdf1d8" stroke="#c98a12" stroke-width="1.5"/>
<text x="90" y="195.7" font-size="10.5" fill="#78350f" text-anchor="middle">寄存器0</text>
<text x="52" y="195.8" font-size="11" fill="#d1493a" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">N</text>
