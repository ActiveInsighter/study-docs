<text x="30" y="380" font-size="14" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">A<tspan baseline-shift="38%" font-size="72%">(k)</tspan>[i][j] = min{ A<tspan baseline-shift="38%" font-size="72%">(k−1)</tspan>[i][j],  A<tspan baseline-shift="38%" font-size="72%">(k−1)</tspan>[i][k] + A<tspan baseline-shift="38%" font-size="72%">(k−1)</tspan>[k][j] }</text>
<text x="30" y="410" font-size="13" fill="#71717a">经 v₀：A[2][1] = 5 + 6 = 11；经 v₁：A[0][2] = 6 + 4 = 10；经 v₂：A[1][0] = 4 + 5 = 9</text>
<text x="30" y="440" font-size="13" fill="#71717a">A<tspan baseline-shift="38%" font-size="72%">(2)</tspan> 即任意两顶点间的最短路径长度（黄色为本轮被更新的值）</text>
