<text x="300" y="80" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace"></text>
<text x="300" y="80" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 用并查集判断图有几个连通分量（邻接矩阵）</text>
<text x="300" y="97.4" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">int ComponentCount(int g[5][5]) {</text>
<text x="300" y="114.8" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  int S[5];                       </text>
<text x="544.8" y="114.8" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 定义、初始化并查集</text>
<text x="300" y="132.2" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  for (int i = 0; i &lt; 5; i++) S[i] = -1;</text>
<text x="300" y="149.6" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  for (int i = 0; i &lt; 5; i++)     </text>
<text x="544.8" y="149.6" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 遍历各条边（上三角）</text>
<text x="300" y="167" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    for (int j = i + 1; j &lt; 5; j++)</text>
<text x="300" y="184.4" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">      if (g[i][j] &gt; 0) {          </text>
<text x="544.8" y="184.4" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 结点 i、j 之间有边</text>
<text x="300" y="201.8" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">        int iRoot = Find(S, i);</text>
<text x="300" y="219.2" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">        int jRoot = Find(S, j);</text>
<text x="300" y="236.6" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">        if (iRoot != jRoot)       </text>
<text x="544.8" y="236.6" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 不在同一集合则合并</text>
<text x="300" y="254" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">          Union(S, iRoot, jRoot);</text>
<text x="300" y="271.4" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">      }</text>
<text x="300" y="288.8" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  int count = 0;                  </text>
<text x="544.8" y="288.8" font-size="12" fill="#8b8b94" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">// 统计有几个连通分量</text>
<text x="300" y="306.2" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  for (int i = 0; i &lt; 5; i++)</text>
<text x="300" y="323.6" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">    if (S[i] &lt; 0) count++;</text>
<text x="300" y="341" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">  return count;</text>
<text x="300" y="358.4" font-size="12" fill="#3f3f46" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">}</text>
</svg>
