<rect x="238" y="30" width="84" height="44" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="280" y="56.2" font-size="12" fill="#1e3a8a" text-anchor="middle">进程3</text>
<rect x="322" y="30" width="84" height="44" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
