<rect x="406" y="30" width="84" height="44" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="448" y="56.2" font-size="12" fill="#1e3a8a" text-anchor="middle">进程n</text>
<rect x="40" y="74" width="480" height="44" rx="0" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
<text x="280" y="100.9" font-size="14" fill="#18181b" text-anchor="middle">调度程序（scheduler）</text>
<text x="280" y="142" font-size="12" fill="#3f3f46" text-anchor="middle">不支持内核级线程的操作系统，调度程序的处理对象是进程</text>
<rect x="70" y="180" width="84" height="44" rx="0" fill="#e8effc" stroke="#3b6fd4" stroke-width="1.5"/>
