<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 465" width="1070" height="465" role="img" aria-label="数据旁路与Load-Use停顿：结果何时可供下一条使用？" style="font-family: Noto Sans CJK SC, sans-serif;">
<title>数据旁路与Load-Use停顿：结果何时可供下一条使用？</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="#64748B"/></marker><marker id="arrowblue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="#2563EB"/></marker></defs>
<rect width="1070" height="465" rx="18" fill="white" stroke="#CFD8E3" stroke-width="2"/>
<text x="32" y="46" font-size="24" font-weight="700" fill="#17243A">数据旁路与Load-Use停顿：结果何时可供下一条使用？</text>
<rect x="32" y="57" width="62" height="5" rx="2.5" fill="#2563EB"/>
<rect x="32" y="93" width="232" height="82" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="148.0" y="127.4" text-anchor="middle" fill="#2563EB" font-size="18" font-weight="700">ADD → SUB</text>
<text x="148.0" y="150.4" text-anchor="middle" fill="#17243A" font-size="14" font-weight="400">EX产生ALU结果</text>
<rect x="293" y="93" width="244" height="82" rx="10" fill="#D1FAE5" stroke="#0F766E" stroke-width="1.5"/>
<text x="415.0" y="127.4" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="700">EX → EX前递</text>
<text x="415.0" y="150.4" text-anchor="middle" fill="#17243A" font-size="14" font-weight="400">紧邻相关通常无需停顿</text>
<line x1="266" y1="133" x2="288" y2="133" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowblue)"/>
<rect x="566" y="86" width="458" height="102" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="586" y="119" text-anchor="start" fill="#17243A" font-size="17" font-weight="700">RAW真相关示例</text>
<text x="586" y="146" text-anchor="start" fill="#2563EB" font-size="16" font-weight="400">ADD R1,R2,R3   →   SUB R4,R1,R5</text>
<text x="586" y="170" text-anchor="start" fill="#64748B" font-size="14" font-weight="400">ALU结果及时转发，避免等写回WB。</text>
<rect x="32" y="235" width="232" height="82" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="148.0" y="269.4" text-anchor="middle" fill="#B45309" font-size="18" font-weight="700">LW → ADD</text>
<text x="148.0" y="292.4" text-anchor="middle" fill="#17243A" font-size="14" font-weight="400">MEM末尾才得到数据</text>
<rect x="293" y="235" width="244" height="82" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="415.0" y="269.4" text-anchor="middle" fill="#B91C1C" font-size="18" font-weight="700">插入1拍气泡</text>
<text x="415.0" y="292.4" text-anchor="middle" fill="#17243A" font-size="14" font-weight="400">经典五级流水假设</text>
<line x1="266" y1="276" x2="288" y2="276" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="566" y="232" width="458" height="103" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/>
<text x="586" y="265" text-anchor="start" fill="#17243A" font-size="17" font-weight="700">Load-Use示例</text>
<text x="586" y="293" text-anchor="start" fill="#B45309" font-size="16" font-weight="400">LW R1,0(R2)   →   ADD R3,R1,R4</text>
<text x="586" y="318" text-anchor="start" fill="#64748B" font-size="14" font-weight="400">下一条EX太早，前递到达不及。</text>
<rect x="32" y="365" width="993" height="69" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="54" y="394" text-anchor="start" fill="#17243A" font-size="17" font-weight="600">计算罚时：先标记“数据产生阶段”和“消费阶段”，再判断前递是否赶得上。</text>
<text x="54" y="418" text-anchor="start" fill="#64748B" font-size="14" font-weight="400">是否恰好停1拍取决于题设给出的流水级、访存延迟、旁路与时钟边沿安排。</text>
</svg>